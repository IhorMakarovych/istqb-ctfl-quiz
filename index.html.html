pletion report is prepared during test completion, when a project, test level, or test type is complete and when, ideally, its exit criteria have been met. This report uses information from test progress reports and other data", "Is not correct. Test progress reports are mostly used during test monitoring and test control, and test completion, not during test analysis", "Is not correct. Test progress reports are most used during test monitoring and test control, and test completion, not during test planning"], "chapter": "Chapter 5: Managing the Test Activities", "chapterNum": 5}, {"id": "C37", "text": "Which of the following is __NOT__ an example of how configuration management supports testing?", "options": ["All commits to the repository are uniquely identified and version controlled", "All changes in the test environment elements are tracked", "All requirement specifications are referenced unambiguously in test plans", "All identified defects have an assigned status"], "correct": [3], "context": null, "perOption": ["Is not correct. When a user reports a software failure, thanks to the unique identification of commits, it is possible to reassemble the files from the software version which was used by the user (as well as the corresponding versions of the test scripts) and thus reproduce the failure and locate the defect faster", "Is not correct. If a change to the test environment causes unexpected issues during testing, configuration management allows testers to roll back to a previous version of the environment. This ensures that testing can continue without being affected by the change", "Is not correct. Configuration management ensures that all identified documentation (e.g., requirement specifications) and software items are referenced unambiguously in test documentation (e.g., test plans)", "Is correct. This is ensured by defect management, not by the configuration management process"], "chapter": "Chapter 5: Managing the Test Activities", "chapterNum": 5}, {"id": "C38", "text": "Consider the following defect report for a web-based shopping application:\n\nApplication: WebShop v0.99\nDefect: Login button not working\nSteps to Reproduce:\n1. Launch the website\n2. Click on the login button\nExpected result: The user should be redirected to the login page.\nActual result: The login button does not respond when clicked.\nSeverity: High\nPriority: Urgent\n\nWhat is the MOST important information that is missing from this defect report?", "options": ["Name of the tester and date", "Test environment elements and their version numbers", "Identification of the test object", "Impact on the interests of stakeholders"], "correct": [1], "context": null, "perOption": ["Is not correct. This is important, but not as important as test environment elements", "Is correct. The important thing that is missing is the identification of the browser and device used for the testing. The browser and device information are important because such a defect can be browser- or device-specific. For example, a login button may work fine on one browser (or one version of a specific browser) but not on another. Therefore, the browser and device information can help the developers to reproduce the issue and find the root cause of the problem more quickly", "Is not correct. The test object is identified (WebShop v0.99)", "Is not correct. The impact is included – this is severity (high)"], "chapter": "Chapter 5: Managing the Test Activities", "chapterNum": 5}, {"id": "C39", "text": "Tools from which of the following categories help with the organization of test cases, detected defects and configuration management?", "options": ["Test execution and coverage tools", "Test design and implementation tools", "Defect management tools", "Test management tools"], "correct": [3], "context": null, "perOption": ["Is not correct. Test execution and coverage tools facilitate the automated execution of test cases and the measurement of the coverage achieved by running those test cases. However, these tools do not help with the organization of defects and configuration management", "Is not correct. Test design and test implementation tools facilitate the generation of test cases, test data and test procedures, but they do not help with the organization of defects and configuration management", "Is not correct. Defect management tools are used to manage defects but are not testing tools and are not used to organize test cases or configuration management", "Is correct. Test management tools increase the test process efficiency by facilitating the management of the software development lifecycle (SDLC), requirements, tests, defects, and configuration management"], "chapter": "Chapter 6: Test Tools", "chapterNum": 6}, {"id": "C40", "text": "Which of the following is MOST likely to be a benefit of test automation?", "options": ["The capability of generating test cases without access to the test basis", "The achievement of increased coverage through more objective assessment", "The increase in test execution times available with higher processing power", "The prevention of human errors through greater consistency and repeatability"], "correct": [3], "context": null, "perOption": ["Is not correct. ‘The capability of generating test cases without access to the test basis’ is not possible. The generation of test cases by either testers or tools requires access to the test basis", "Is not correct. ‘The achievement of increased coverage through more objective assessment’ is not a direct benefit of test automation. Test automation will provide more objective assessment of coverage, however that objective assessment will not increase the coverage. Only by using the results of the coverage to write further test cases can the coverage possibly be increased", "Is not correct. ‘The increase in test execution times available with higher processing power’ is a contradictory statement as higher processing power would normally reduce execution times, and increased execution times are not a benefit as the testing would take longer", "Is correct. The prevention of human errors through greater consistency and repeatability is a benefit of test automation as test automation cannot suffer from human errors. For instance, it means that tests are consistently derived from requirements, test data is created in a systematic manner, and tests are executed by a tool in the same order with the same frequency"], "chapter": "Chapter 6: Test Tools", "chapterNum": 6}];
const DATA_D = [{"id": "D1", "text": "Which of the following is a typical test objective?", "options": ["Finding and fixing defects in the test object", "Maintaining effective communications with developers", "Validating that legal requirements have been met", "Building confidence in the quality of the test object"], "correct": [3], "context": null, "perOption": ["Is not correct. Finding and fixing defects in the test object is not a typical test objective as although identifying defects is an objective of testing, fixing defects is not a test activity", "Is not correct. Maintaining effective communications with developers is not a typical test objective although it is useful in achieving other objectives of testing, such as providing stakeholders with information that enables them to make informed decisions. It is not a primary reason for performing testing", "Is not correct. Validating that legal requirements have been met is not a typical test objective because validation is concerned with checking whether the system meets users’ and other stakeholders’ needs in its operational environment. Checking that legal requirements have been met is a form of verification", "Is correct. Building confidence in the quality of the test object is achieved by executing tests that passed"], "chapter": "Chapter 1: Fundamentals of Testing", "chapterNum": 1}, {"id": "D2", "text": "A designer documents a design for a user interface that does not suitably address disabled users because the designer is tired. The programmer implements the user interface in line with the design but as they are working under severe time pressure, they do not include suitable exception handling in their program code for bonus calculations. When the operational system is used, complaints are made by some disabled users about the interface and the company is subsequently fined by the relevant regulatory authority. No one notices that bonus calculations are sometimes incorrect. Which of the following statements is CORRECT?", "options": ["The miscalculation of bonuses is a defect that occasionally occurs", "The fine received for failing to address some disabled users is a failure", "The programmer working under severe time pressure is a root cause", "The design of the user interface includes a designer error"], "correct": [2], "context": null, "perOption": ["Is not correct. The miscalculation of bonuses is a failure by the system, not a defect", "Is not correct. The system not suitably supporting disabled users is a failure which eventually results in a fine, but the fine itself is not a failure (it appears to be the correct functioning of the regulatory system)", "Is correct. The error is made by the programmer and this mistake is caused by them working under severe time pressure, which is the root cause of the subsequent defect", "Is not correct. The poor design of the user interface, which does not suitably address disabled users, is a design defect caused by the designer error. Thus the design of the user interface includes a design defect not a designer error"], "chapter": "Chapter 1: Fundamentals of Testing", "chapterNum": 1}, {"id": "D3", "text": "Test conditions are being used by testers to generate test cases and execute tests. Even though the test conditions remain the same, the test cases are varied each time. Which of the following 'principles of testing' is being addressed through the variation of test cases?", "options": ["Tests wear out", "Absence-of-defects fallacy", "Early testing saves time and money", "Defects cluster together"], "correct": [0], "context": null, "perOption": ["Is correct. The ‘tests wear out’ principle is concerned with the idea that repeating identical tests on unaltered code is unlikely to uncover novel defects and therefore, modifying tests may be essential. By using test conditions to generate new tests each time, the tests will not be identical and the risk of the tests wearing out is reduced", "Is not correct. The ‘absence-of-defects fallacy’ principle is concerned with ensuring that users’ needs are fulfilled even if lots of testing is done and no defects are found (i.e., validation is also necessary). The use of test conditions to generate test cases and execute tests does not directly address this concern", "Is not correct. The ‘early testing saves time and money’ principle is concerned with fixing defects early on to prevent the occurrence of subsequent defects in derived work products, thereby reducing costs and the likelihood of failures. This is typically addressed by starting testing (both static and dynamic) as early as possible, but this is not addressed by using test conditions to generate test cases and execute tests", "Is not correct. The ‘Defects cluster together’ principle is concerned with the distribution of defects in a system, which typically follows a Pareto distribution. The use of test conditions to generate test cases and execute tests does not address this concern, which is typically addressed by risk-based testing"], "chapter": "Chapter 1: Fundamentals of Testing", "chapterNum": 1}, {"id": "D4", "text": "Given the following test tasks:\n1. Derive test cases from test conditions\n2. Identify reusable testware\n3. Organize test cases into test procedures\n4. Evaluate the test basis and the test object\n\nAnd the following test activities:\nA. Test analysis\nB. Test design\nC. Test implementation\nD. Test completion\n\nWhich of the following BEST matches the tasks with the activities?", "options": ["1B, 2A, 3D, 4C", "1B, 2D, 3C, 4A", "1C, 2A, 3B, 4D", "1C, 2D, 3A, 4B"], "correct": [1], "context": "Considering each of the listed test activities and their tasks: Test analysis - To identify the features that require testing, the test basis is analyzed and defined as test conditions, which are then prioritized along with related risks. During this test analysis, defects in the test basis are typically uncovered, and the test object's testability may also be assessed. (Task 4) Test design - Involves using test conditions to create test cases and other necessary testware, such as test data requirements and test charters for exploratory testing. (Task 1) Test implementation - Test procedures, such as manual and automated test scripts, are created from test cases and may be assembled into test suites. Test procedures are prioritized and arranged in a test execution schedule. (Task 3) Test completion - Occurs at project milestones, such as release, end of iteration or end of test level. Testware is identified and archived or handed to the appropriate teams for reuse, the test environment is shut down, and the test activities are analyzed for lessons learned and future improvements. (Task 2)", "perOption": ["Is not correct.", "Is correct. The CORRECT match is: 1B, 2D, 3C, 4A.", "Is not correct.", "Is not correct."], "chapter": "Chapter 1: Fundamentals of Testing", "chapterNum": 1}, {"id": "D5", "text": "Given the following testware:\ni. Test completion report\nii. Data held in a database used for test inputs and expected results\niii. The list of elements needed to build the test environment\niv. Documented sequences of test cases in execution order\nv. Test cases\n\nWhich of the following BEST shows the testware produced as a result of performing test implementation?", "options": ["ii, iv", "iii, v", "i, ii, v", "i, iii, iv"], "correct": [0], "context": "Considering each of the listed testware, and the test activity that produces it: The test completion report is an output of test completion Data held in a database used for inputs and expected results is the test data - output of test implementation The list of elements needed to build the test environment is the test environment requirements - output of test design Documented sequences of test cases in execution order are the test procedures - output of test implementation Test cases - output of test design Test implementation produces the following outputs: test procedures (iv), automated test scripts, test suites, test data (ii), test execution schedule, and test environment elements such as stubs, drivers, simulators, and service virtualizations.", "perOption": ["Is correct. Items ii and iv in the list are produced as a result of test implementation.", "Is not correct.", "Is not correct.", "Is not correct."], "chapter": "Chapter 1: Fundamentals of Testing", "chapterNum": 1}, {"id": "D6", "text": "Which of the following is MOST likely to describe a task performed by someone in a test management role?", "options": ["Evaluate the test basis and the test object", "Define test environment requirements", "Assess testability of the test object", "Create the test completion report"], "correct": [3], "context": null, "perOption": ["Is not correct. The testing role is primarily responsible for the technical and engineering aspects of testing, such as test analysis, test design, test implementation, and test execution. Evaluating the test basis for defects and the test object for testability are tasks performed as part of test analysis, so it is likely they are tasks performed by the testing role", "Is not correct. The testing role is primarily responsible for the technical and engineering aspects of testing, such as test analysis, test design, test implementation, and test execution. Defining the test environment requirements is a task performed as part of test design, so it is likely to be a task performed by the testing role", "Is not correct. The testing role is primarily responsible for the technical and engineering aspects of testing, such as test analysis, test design, test implementation, and test execution. Assessing the testability of a test object is a task performed as part of test analysis, so it is likely to be a task performed by the testing role", "Is correct. The test management role primarily involves activities related to test planning, test monitoring and test control, and test completion. Thus, creating the test completion report, which is the prime output from the test completion, is likely to be a task performed by the test management role"], "chapter": "Chapter 1: Fundamentals of Testing", "chapterNum": 1}, {"id": "D7", "text": "Which of the following is an advantage of the whole team approach?", "options": ["Improved communication between team members", "Decreased individual accountability for quality", "Faster deployment of deliverables to the end users", "Reduced collaboration with external business users"], "correct": [0], "context": null, "perOption": ["Is correct. The whole team approach promotes robust communication and collaboration between the team members", "Is not correct. While the whole team approach prioritizes collective accountability for quality, each individual team member is still equally accountable for quality", "Is not correct. The whole team approach is about how the team works together, with the aim of higher quality deliverables, but it does not necessarily result in faster deployment to end users", "Is not correct. When using the whole team approach, testers work with business representatives to create acceptance tests. There is no suggestion that the approach will reduce collaboration with external business users"], "chapter": "Chapter 1: Fundamentals of Testing", "chapterNum": 1}, {"id": "D8", "text": "Given the following benefits and drawbacks of the independence of testing:\ni. The testers work in a different location from the developers\nii. Testers question the assumptions programmers make while writing code\niii. A confrontational dynamic has been established between testers and developers\niv. Developers have convinced themselves that testers are mostly accountable for quality\nv. Testers have different biases than those held by the developers\n\nWhich are MOST likely to be considered benefits?", "options": ["i, iv", "ii, v", "i, iii, iv", "ii, iii, v"], "correct": [1], "context": "Considering each of the listed benefits and drawbacks of the independence of testing: Ideally, we want close collaboration between testers and developers, which is not increased by isolation. Thus, this is a disadvantage Testers and developers have varied backgrounds, technical viewpoints, and potential biases, allowing testers to usefully challenge assumptions made by stakeholders during system specification and implementation. Thus, this is an advantage The main disadvantage of independence of testing is that testers may become isolated from the development team, leading to communication problems, a lack of collaboration, and potentially an adversarial relationship, with testers being blamed for delays and bottlenecks in the release process. Thus, this is a disadvantage One of the disadvantages of independence of testing is that testers may become isolated from the development team, leading to developers feeling less accountable for quality. Thus, this is a disadvantage The primary benefit of independence of testing is that testers are more likely to identify different types of failures and defects compared to developers, due to their varied backgrounds, technical viewpoints, and potential biases, including cognitive bias", "perOption": ["Is not correct.", "Is correct. The list entries showing benefits are ii and v.", "Is not correct.", "Is not correct."], "chapter": "Chapter 1: Fundamentals of Testing", "chapterNum": 1}, {"id": "D9", "text": "Which of the following is a good testing practice that applies to all software development lifecycles?", "options": ["Each test level has specific and distinct test objectives", "Test implementation and execution for a given test level should start during the corresponding development phase", "Testers should start test design as soon as drafts of the relevant work products become available", "Every dynamic testing activity has a corresponding static testing activity"], "correct": [0], "context": null, "perOption": ["Is correct. Each test level has specific and distinct test objectives as a different form of test object (e.g., single component and complete system) is tested at each test level and overlapping test objectives would lead to unnecessary duplication", "Is not correct. Test analysis and test design for a given test level should start during the corresponding development phase to facilitate early testing (e.g., acceptance test analysis and test design should begin during requirements analysis). Test implementation will generally start later, and test execution will start during the test level", "Is not correct. Test design for a given test level should start during the corresponding development phase to facilitate early testing, however test design (e.g., test case generation) needs to be based on an agreed test basis, not an early draft, otherwise significant test effort may be wasted on creating test cases for a design that later changes", "Is not correct. Quality control applies to all development activities, meaning that every software development activity has a corresponding test activity. However, the same symmetry does not apply to dynamic testing and static testing. There are some static testing activities (e.g., static analysis) for which there is no obvious corresponding dynamic testing activity"], "chapter": "Chapter 2: Testing Throughout the SDLC", "chapterNum": 2}, {"id": "D10", "text": "Which of the following is an example of a test-first approach to development?", "options": ["Behavior-Driven Development", "Test Level Driven Development", "Function-Driven Development", "Performance-Driven Development"], "correct": [0], "context": null, "perOption": ["Is correct. Behavior-Driven Development (BDD) is a well-known example of a test-first approach to development", "Is not correct. Test Level Driven Development is not a correct example of a test-first approach to development", "Is not correct. Function-Driven Development is not a correct example of a test-first approach to development", "Is not correct. Performance-Driven Development is not a correct example of a test-first approach to development"], "chapter": "Chapter 2: Testing Throughout the SDLC", "chapterNum": 2}, {"id": "D11", "text": "Which of the following is MOST likely to be a challenge encountered when implementing DevOps?", "options": ["Making sure that non-functional quality characteristics are not overlooked", "Managing continuously changing test environments", "The need for more manual testers with suitable experience", "Setting up the test automation as part of the delivery pipeline"], "correct": [3], "context": null, "perOption": ["Is not correct. DevOps generally increases the visibility of non-functional quality characteristics, such as performance and reliability", "Is not correct. Automated processes like continuous integration/continuous delivery (CI/CD) used in DevOps facilitate stable test environments", "Is not correct. Automated processes like CI/CD used in DevOps generally reduce the need for manual testing", "Is correct. DevOps implementation can pose several risks and challenges, including the need to define and set up the delivery pipeline, introduce and maintain CI/CD tools, and establish and maintain test automation"], "chapter": "Chapter 2: Testing Throughout the SDLC", "chapterNum": 2}, {"id": "D12", "text": "Which of the following BEST describes retrospectives?", "options": ["Retrospectives allow team members to identify other team members who did not fully contribute to achieving quality as required by the whole team approach", "Retrospectives give testers an opportunity to identify activities that were successful so that these are retained when potential improvements are made in the future", "Retrospectives are where agile team members are allowed to voice their concerns about management and customers in a blameless environment", "Retrospectives give agile team members a forum where they focus on discussing the plan and technical decisions for the next iteration"], "correct": [1], "context": null, "perOption": ["Is not correct. The benefits of retrospectives include team bonding and learning from sharing issues, and better collaboration between developers and testers through reviewing and improving working practices. Calling out individuals who a team member may feel did not fully contribute to achieving quality as required by the whole team approach will not contribute to this team bonding and collaboration", "Is correct. During the retrospective, the group discusses what aspects of the project were successful and should be retained, as well as areas that could be improved, and how to do so", "Is not correct. The benefits of retrospectives are based on increased effectiveness and efficiency through process improvements; they are not an opportunity to let off steam and criticize management and customers. Also, the test results are recorded, usually in the test completion report, so anything said in the meeting could be read by other stakeholders", "Is not correct. Retrospectives are meetings that are typically held at the end of an iteration where team members will focus on discussing quality-related issues that have occurred in the current iteration. They are not used for making plans or technical decisions for the next iteration; this would be done in the iteration planning meeting at the start of the next iteration"], "chapter": "Chapter 2: Testing Throughout the SDLC", "chapterNum": 2}, {"id": "D13", "text": "Which of the following tests is MOST likely to be performed as part of functional testing?", "options": ["The test checks that the sort function puts the elements of the list or array in ascending order", "The test checks whether the sort function completes sorting within one second of starting", "The test checks how easily the sort function can be changed from sorting ascending to sorting descending", "The test checks that the sort function still functions correctly when moved from a 32-bit to a 64-bit architecture"], "correct": [0], "context": null, "perOption": ["Is correct. Checking that the sort function puts the elements of the list or array in ascending order is evaluating the functional correctness of the sort function, which is part of functional testing", "Is not correct. Assessing whether the sort function meets its non-functional requirement to complete within one second is part of testing its performance efficiency, which is part of non-functional testing", "Is not correct. Evaluating the ease with which the sort function can be modified from sorting ascending to sorting descending is testing its modifiability, a form of non-functional maintainability testing, which is part of non-functional testing", "Is not correct. Assessing that the sort function still functions correctly when moved from a 32-bit to a 64-bit architecture is testing its adaptability, a form of portability testing, which is part of non-functional testing"], "chapter": "Chapter 2: Testing Throughout the SDLC", "chapterNum": 2}, {"id": "D14", "text": "Which of the following is MOST likely to be a trigger that leads to maintenance testing of a currency exchange system?", "options": ["The developers reported that changing the currency exchange system was difficult and the testers decided to check if this was true", "The refund option of the currency exchange system was removed as it did not always repay the correct amount to customers", "The agile team has started developing a user story that adds a new customer loyalty feature to the currency exchange system", "The language support option of the currency exchange system was used to enable both English and local language currency transactions"], "correct": [1], "context": null, "perOption": ["Is not correct. Assuming that testers could check the ease of changing the currency exchange system then it would be done by maintainability testing rather than maintenance testing, so this is not a trigger for maintenance testing", "Is correct. A system modification (such as a fix or enhancement) is an example of a trigger for maintenance testing. The removal of the refund option of the currency exchange system was a fix that would lead to maintenance testing", "Is not correct. If the agile team has started developing a user story that adds a new customer loyalty feature to the currency exchange system, then this will result in them testing the new feature, and then they would perform regression testing. No maintenance testing is required in this situation", "Is not correct. Reconfiguration of the currency exchange system to support both the local language and English currency transactions is not a system modification, a change to the operational environment, or a system retirement, which are the three triggers for maintenance testing"], "chapter": "Chapter 2: Testing Throughout the SDLC", "chapterNum": 2}, {"id": "D15", "text": "Which of the following __CANNOT__ be examined by static testing?", "options": ["Contract", "Test plan", "Encrypted code", "Test charter"], "correct": [2], "context": null, "perOption": ["Is not correct. Most work products can be examined using some form of static testing, and a contract must be interpretable by humans and so could be reviewed, which is a form of static testing", "Is not correct. Most work products can be examined using some form of static testing, and a test plan must be interpretable by humans and so could be reviewed, which is a form of static testing", "Is correct. Most work products can be examined using some form of static testing; however it is not suitable for work products that are too complex for human interpretation and should not be analyzed by tools, and encrypted code is too complex for humans and if it is properly encrypted it will not be analyzable by most tools", "Is not correct. Most work products can be examined using some form of static testing, and a test charter must be interpretable by humans and so could be reviewed, which is a form of static testing"], "chapter": "Chapter 3: Static Testing", "chapterNum": 3}, {"id": "D16", "text": "Which of the following statements about the value of static testing is CORRECT?", "options": ["The defect types found by static testing are different from the defect types that can be found by dynamic testing", "Dynamic testing can detect the defect types that can be found by static testing plus some additional defect types", "Dynamic testing can identify some of the defects that can be found by static testing but not all of them", "Static testing can identify the defect types that can be found by dynamic testing as well as some extra defect types"], "correct": [2], "context": "Some defect types that can only be detected by static testing, such as unreachable code, design patterns not implemented as desired and defects in non-executable work products. Some defect types that can be found by both static testing and dynamic testing, such as a programming defect that can be observed by a reviewer in a code review and which causes an observable failure during dynamic testing. And some defect types that can only be detected by dynamic testing, such as performance issues or memory issues that can only be observed when executing the code or system.", "perOption": ["Is not correct.", "Is not correct.", "Is correct.", "Is not correct."], "chapter": "Chapter 3: Static Testing", "chapterNum": 3}, {"id": "D17", "text": "Given the following descriptions of review activities:\n1. Detected anomalies are deliberated upon, and determinations are reached regarding their status, ownership, and any further steps needed\n2. Defects are recorded, and any needed updates are addressed prior to the acceptance of the work product\n3. Reviewers employ techniques to come up with suggestions and questions about the work product and to spot anomalies\n4. The objective of the review and its schedule are established to ensure a focused and efficient review\n5. Participants are provided with access to the item being reviewed\n\nWhich of the following is the CORRECT sequence in the review process of the activities that correspond to the descriptions?", "options": ["4 -- 3 -- 5 -- 2 -- 1", "4 -- 5 -- 3 -- 1 -- 2", "5 -- 4 -- 1 -- 3 -- 2", "5 -- 4 -- 3 -- 2 -- 1"], "correct": [1], "context": "The five listed descriptions and the corresponding review process activities are: This describes part of the ‘communication and analysis’ activity This describes part of the ‘fixing and reporting’ activity This describes part of the ‘individual review’ activity This describes part of the ‘planning’ activity This describes part of the ‘review initiation’ activity The generic review process from ISO/IEC 20246, which is outlined in the syllabus, comprises the following activities in this logical order: Planning (4) Review initiation (5) Individual review (3) Communication and analysis (1) Fixing and reporting (2)", "perOption": ["Is not correct.", "Is correct. The correct sequence of activities is: 4 – 5 – 3 – 1 – 2.", "Is not correct.", "Is not correct."], "chapter": "Chapter 3: Static Testing", "chapterNum": 3}, {"id": "D18", "text": "Which participant in the review process is responsible for ensuring that the review meetings run effectively and that everyone at the meetings can voice their opinions freely?", "options": ["Manager", "Moderator", "Chairperson", "Review Leader"], "correct": [1], "context": null, "perOption": ["Is not correct. The manager is responsible for deciding what needs to be reviewed and allocating resources, such as staff and time, for the review", "Is correct. The moderator (or facilitator) is responsible for ensuring that the review meetings run effectively, including managing time, mediating discussions, and creating a safe environment where everyone can voice their opinions freely", "Is not correct. The chairperson is not a recognized role in reviews", "Is not correct. The review leader is responsible for overseeing the review process, such as selecting the review team members, scheduling review meetings, and ensuring that the review is completed successfully"], "chapter": "Chapter 3: Static Testing", "chapterNum": 3}, {"id": "D19", "text": "You perform system testing of an e-commerce web application and are provided with the following requirement: *REQ 05-017. If the total cost of purchases exceeds $100, the customer gets a 5% discount on subsequent purchases. Otherwise, the customer does not receive a discount.* Which test techniques will be MOST helpful in designing test cases based on this requirement?", "options": ["White-box test techniques", "Black-box test techniques", "Experience-based test techniques", "Risk-based test techniques Select ONE opti[]{#_bookmark30 .anchor}on."], "correct": [1], "context": null, "perOption": ["Is not correct. The document does not refer to the test object’s internal structure but specifies the desired behavior of the test object. Therefore, white-box test techniques will not be helpful in designing test cases", "Is correct. The document is a requirement that specifies the desired behavior of the test object. Therefore, the most suitable test techniques in this case are the black-box test techniques (e.g., Boundary Value Analysis or Decision Table Testing)", "Is not correct. Although experience-based test techniques can be used to design test cases based on this document, black-box test techniques will be more suitable. The document describes a precise business rule and, in addition, wording like \"exceeds $100\" suggests the existence of important equivalence partition boundaries that should be tested using black-box test techniques like Boundary Value Analysis", "Is not correct. Risk-based test techniques are not a recognized type of test technique"], "chapter": "Chapter 4: Test Analysis and Design", "chapterNum": 4}, {"id": "D20", "text": "The system for selling cinema tickets calculates the discount type based on the client's birth year (BY) and on the current year (CY) as follows: Let D be the difference between CY and BY, that is, D = CY - BY\n\nIf D < 0 then print the error message \"birth year cannot be greater than current year\"\nIf 0 ≤ D < 18 then apply the student discount\nIf 18 ≤ D < 65 then apply no discount\nIf D ≥ 65 then apply the pensioner discount\n\nYour test suite already contains two test cases:\nBY = 1990, CY = 2020, expected result: no discount\nBY = 2030, CY = 2029, expected result: print the error message\n\nWhich of the following test data sets should be added to achieve full valid equivalence partitioning coverage for the discount type?", "options": ["BY = 2001, CY = 2065", "BY = 1900, CY = 1965", "BY = 1965, CY = 1900", "BY = 2011, CY = 2029", "BY = 2000, CY = 2000"], "correct": [1, 4], "context": "There are two equivalence partitions that are not yet covered, which correspond to “student discount” and “pensioner discount”.", "perOption": ["Is not correct. CY – BY = 64, so these inputs correspond to the already covered “no discount” partition", "Is correct. CY – BY = 65, so these inputs correspond to a partition that is not yet covered (“pensioner discount”)", "Is not correct. CY – BY = –65, so these inputs correspond to the already covered “error message” partition", "Is not correct. CY – BY = 18, so these inputs correspond to the already covered “no discount” partition", "Is correct. CY – BY = 0, so these inputs correspond to a partition that is not yet covered (“student discount”)"], "chapter": "Chapter 4: Test Analysis and Design", "chapterNum": 4}, {"id": "D21", "text": "You are testing a temperature control system for a horticultural cold storage facility. The system receives the temperature (in full degrees Celsius) as the input. If the temperature is between 0 and 2 degrees inclusive, the system displays the message \"temperature OK\". For lower temperatures, the system displays the message \"temperature too low\" and for higher temperatures it displays the message \"temperature too high\". Using two-value boundary value analysis, which of the following sets of test inputs provides the highest level of boundary value coverage?", "options": ["--1, 3", "0, 2", "--1, 0, 2, 3", "--2, 0, 2, 4"], "correct": [2], "context": "There are three equivalence partitions: {…, –2, –1}, {0, 1, 2}, {3, 4, …}. For 2-value BVA all the boundary values for all the equivalence partitions must be covered. The boundary values are –1 (for the “temperature too low” partition), 0, 2 (for the “temperature OK” partition) and 3 (for the “temperature too high” partition).", "perOption": ["Is not correct.", "Is not correct.", "Is correct. The correct option is: –1, 0, 2, 3.", "Is not correct."], "chapter": "Chapter 4: Test Analysis and Design", "chapterNum": 4}, {"id": "D22", "text": "You are designing test cases based on the following decision table.\n\nR1: Age 0-18, Experience –, Registered? NO → Category A\nR2: Age 19-65, Experience 0-4, Registered? NO → Category A\nR3: Age 19-65, Experience >4, Registered? NO → Category B\nR4: Age >65, Experience –, Registered? NO → Category B\nR5: Age 0-18, Experience –, Registered? YES → Category B\nR6: Age 19-65, Experience –, Registered? YES → Category D\nR7: Age >65, Experience –, Registered? YES → Category C\n\nSo far you have designed the following test cases:\nTC1: 19-year-old, unregistered man with no experience; expected result: category A\nTC2: 65-year-old, unregistered woman with 5 years of experience; expected result: category B\nTC3: 66-year-old, registered man with no experience; expected result: category C\nTC4: 65-year-old, registered woman with 4 years of experience; expected result: category D\n\nWhich of the following test cases, when added to the existing set of test cases, will increase the decision table coverage?", "options": ["66-year-old, unregistered man with no experience; expected result: category B", "55-year-old, unregistered woman with 2 years of experience; expected result: category A", "19-year-old, registered woman with 5 years of experience; expected result: category D", "No additional test case can increase the already achieved decision table coverage"], "correct": [0], "context": "Test cases TC1, TC2, TC3 and TC4 cover, respectively, rules R2, R3, R7 and R6 in the decision table.", "perOption": ["Is correct. The conditions “66-year-old”, “unregistered” and “no experience” match rule R4, which is not covered by the existing test cases, so after adding this test case, the decision table coverage will increase", "Is not correct. The conditions “55-year-old”, “unregistered” and “2 years of experience” match rule R2, already covered by TC1. So adding this test case will not increase the coverage", "Is not correct. The conditions “19-year-old”, “registered” and “5 years of experience” match rule R6, already covered by TC4. So adding this test case will not increase the coverage", "Is not correct. The existing test cases cover only 4 out of 7 columns of the decision table. The coverage can be increased by adding test cases that cover yet uncovered columns, that is, R1, R4 and R5"], "chapter": "Chapter 4: Test Analysis and Design", "chapterNum": 4}, {"id": "D23", "text": "You are applying state transition testing to the hotel room reservation system modeled by the following state transition table, with 4 states and 5 different events.\n\nS1: Requesting -- Available → S2, NotAvailable → S3\nS2: Confirmed -- ChangeRoom → S1, Cancel → S4, Pay → S4\nS3: Waiting list -- Available → S2, Cancel → S4\nS4: End -- (no outgoing transitions)\n\nAssuming all test cases start in the 'Requesting' state, which of the following test cases, represented as sequences of events, achieves the highest valid transitions coverage?", "options": ["NotAvailable, Available, ChangeRoom, NotAvailable, Cancel", "Available, ChangeRoom, NotAvailable, Available, Pay", "Available, ChangeRoom, Available, ChangeRoom, NotAvailable", "NotAvailable, Cancel, ChangeRoom, Available, Pay"], "correct": [1], "context": null, "perOption": ["Is not correct. This sequence of five events covers 4 different valid transitions (both “NotAvailable” events correspond to the same transition between S1 and S3). This test case covers 4 out of 7 valid transitions", "Is correct. This sequence of five events covers 5 different transitions (the first “Available” event corresponds to a transition between S1 and S2, and the second “Available” event corresponds to a transition between S3 and S2, so two different transitions are covered). This test case covers 5 out of 7 valid transitions and achieves the highest valid transitions coverage", "Is not correct. This sequence of five events covers 3 different transitions (both “Available” events correspond to the same transition from S1 to S2; both “ChangeRoom” events correspond to the same transition from S2 to S1). This test case covers 3 out of 7 valid transitions", "Is not correct. This sequence of five events does not represent a feasible test case, because after “Cancel” the system ends up in the End state and no further valid transitions can be executed"], "chapter": "Chapter 4: Test Analysis and Design", "chapterNum": 4}, {"id": "D24", "text": "Your test suite S for a program P achieves 100% statement coverage. It consists of three test cases, each of which achieves 50% statement coverage. Which of the following statements is CORRECT?", "options": ["Executing S will cause all possible failures in P", "S achieves 100% branch coverage for P", "Every executable statement in P containing a defect has been run at least once during the execution of S", "After removing one test case from S, the remaining two test cases will still achieve 100% statement coverage"], "correct": [2], "context": null, "perOption": ["Is not correct. A statement with a defect, when executed, does not have to cause a failure. For example, a statement x := y / z will cause a failure only when z equals 0", "Is not correct. 100% statement coverage does not guarantee 100% branch coverage. For example, a test case with x=0 for the code IF (x=0) THEN A; ENDIF achieves 100% statement coverage but does not cover the branch from 1 to 3", "Is correct. 100% statement coverage means that each executable statement was executed at least once", "Is not correct. The removed test case may provide coverage of some statements that are not covered by either of the other two test cases, in which case the remaining two test cases together will not achieve 100% statement coverage"], "chapter": "Chapter 4: Test Analysis and Design", "chapterNum": 4}, {"id": "D25", "text": "Why does white-box testing facilitate defect detection even when the software specification is vague, outdated or incomplete?", "options": ["Test cases are designed based on the structure of the test object rather than the specification", "For each white-box test technique the coverage can be well-defined and easily measured", "White-box test techniques are very well designed to detect omissions in the requirements", "White-box test techniques can be used in both static testing and dynamic testing"], "correct": [0], "context": null, "perOption": ["Is correct. A fundamental strength that all white-box test techniques share is that the entire software implementation is taken into account during testing, which facilitates defect detection even when the software specification is vague, outdated or incomplete. This means white-box testing can find defects such as an extra feature added to the code (either accidentally or deliberately) that is not supposed to be there, which black-box testing cannot detect", "Is not correct. The fact that the coverage can be precisely defined is not the right reason. The achieved level of coverage would have much more impact than the possibility to measure the coverage", "Is not correct. If the software does not implement one or more requirements, white-box testing is unlikely to detect the resulting defects of omission", "Is not correct. While this is true, this is not the right answer, because there is no connection between the capability to be used in both static testing and dynamic testing and the claim that white-box testing facilitates defect detection with poor specifications"], "chapter": "Chapter 4: Test Analysis and Design", "chapterNum": 4}, {"id": "D26", "text": "Which of the following is __NOT__ anticipated by the tester while applying error guessing?", "options": ["The developer misunderstood the formula in the user story for calculating the interest", "The developer wrote \"FA = A*(1+IR^N)\" instead of \"FA = A*(1+IR)^N\" in the source code", "The developer missed the seminar on new compound interest rate legislation", "The accuracy of the interest calculated by the system is not precise enough"], "correct": [2], "context": "Error guessing is about anticipating the errors, defects and failures based on the tester’s knowledge.", "perOption": ["Is not correct. This is an example of anticipating the developer’s error", "Is not correct. This is an example of anticipating the defect", "Is correct. This is an example of a potential root cause of a defect, which is neither an error, defect nor failure, and difficult for the tester to anticipate", "Is not correct. This is an example of anticipating a failure, perhaps based on experience of previous systems in this application domain"], "chapter": "Chapter 4: Test Analysis and Design", "chapterNum": 4}, {"id": "D27", "text": "Which of the following is true about exploratory testing?", "options": ["Test cases are designed before the exploratory testing session starts", "The tester can perform test execution, but cannot perform test design", "Exploratory testing results are good predictors of the number of remaining defects", "During exploratory testing the tester may use black-box test techniques"], "correct": [3], "context": null, "perOption": ["Is not correct. In exploratory testing, test cases are usually created during the exploratory testing session, alongside test analysis, test implementation and test execution", "Is not correct. In exploratory testing, tests are simultaneously designed, executed, and evaluated while the tester learns about the test object", "Is not correct. Exploratory test results depend heavily on the tester’s experience. So, even if the test results of exploratory testing can be used as a predictor of risk and used to assess whether there will be fewer or more defects, compared to the previous exploratory testing session, they are not a good example of reliable defect prediction models that can predict the number of remaining defects", "Is correct. During exploratory testing, the testers can use any test techniques that they find useful"], "chapter": "Chapter 4: Test Analysis and Design", "chapterNum": 4}, {"id": "D28", "text": "Which collaborative user story writing practice enables the team to achieve a collective understanding of what needs to be delivered?", "options": ["Planning poker, so that a team can achieve consensus on the effort needed to implement a user story", "Reviews, so that a team can detect inconsistencies and contradictions in a user story", "Iteration planning, so that user stories with the highest business value for a customer can be prioritized for implementation", "Conversation, so that team members can understand how the software will be used"], "correct": [3], "context": null, "perOption": ["Is not correct. Planning poker can estimate effort for a user story that is already written. It does not help in understanding what should be delivered", "Is not correct. Reviews are not a collaborative user story writing practice", "Is not correct. Iteration planning is a project-related practice, used to plan the work, not to understand what needs to be delivered", "Is correct. Conversation explains how the software will be used and often allows the team to define meaningful acceptance criteria, thus obtaining a shared vision of what should be delivered"], "chapter": "Chapter 4: Test Analysis and Design", "chapterNum": 4}, {"id": "D29", "text": "You have just started designing test cases for the following user story:\n\nAs a customer,\nI want to be able to filter search results by price range, so that I can find products within my budget more easily.\nAcceptance criteria:\nThe filter should work for all versions of the application from version 3.0 upwards\nThe filter should allow the customer to set a price range with a minimum and a maximum price\nThe search results should update dynamically as the customer adjusts the price range filter\n\nIn all test cases the precondition is as follows: there are only two products available, products A and B. Product A costs $100 and product B costs $110. Which of the following is the BEST example of a test case for this user story?", "options": ["Enter webpage and set filter to show prices between $90 and $100. Expected result: results show product A only. Set maximum price to $110. Expected result: results now include both products A and B", "Enter webpage. Expected result: the default minimum and maximum prices are $100 and $110 respectively. Add product C to stock, with price $120. Refresh the client's webpage. Expected result: the default maximum price changes to $120", "Enter webpage and set filter to show prices between $90 and $115. Expected result: results show both products A and B. Change currency from USD to EUR. Expected result: the filter range changes correctly to EUR values, according to the current exchange rate", "Enter webpage with three different browsers: Edge, Chrome and Opera. In each browser set filter between $90 and $110. Expected result: results include both products A and B and the results layout is the same in all three browsers"], "correct": [0], "context": null, "perOption": ["Is correct. This test case is related to acceptance criteria 2 and 3, because we check if we can set price range (acceptance criterion 2) and if the results update dynamically after adjusting the price range filter (acceptance criterion 3)", "Is not correct. This test case is not related to any of the acceptance criteria. It checks if the filter dynamically sets the default minimum and maximum price range, and not that a customer can do it", "Is not correct. This test case is not related to any of the acceptance criteria. It checks the currency exchange feature, which is not discussed in this user story", "Is not correct. This test case is not related to any of the acceptance criteria. It checks the application’s compatibility with different browsers, which is not discussed in this user story"], "chapter": "Chapter 4: Test Analysis and Design", "chapterNum": 4}, {"id": "D30", "text": "Which of the following BEST define EXIT criteria in a testing project?", "options": ["Budget is approved", "Budget runs out", "Test basis is available", "Test cases achieved at least 80% statement coverage", "All test analysts are ISTQB certified at the Foundation Level"], "correct": [1, 3], "context": null, "perOption": ["Is not correct. The approval of the budget is an example of an entry criterion. It would make no sense to approve the budget for some activity that has already been done", "Is correct. Running out of budget can be viewed as a valid exit criterion", "Is not correct. Availability of resources is an example of an entry criterion for testing", "Correct. Coverage is a measure of thoroughness, so it is a typical exit criterion", "Is not correct. This is an example of an entry criterion, checked before the project starts"], "chapter": "Chapter 5: Managing the Test Activities", "chapterNum": 5}, {"id": "D31", "text": "The team wants to estimate the time needed for one tester to execute four test cases for a software component. The team has gathered the following measures of the effort used to execute a single test case: - Best-case scenario: 1 hour - Worst-case scenario: 8 hours - Most likely scenario: 3 hours Given that the three-point estimation technique is being used, what is the final estimate of the time needed to execute all four test cases?", "options": ["14 hours", "3.5 hours", "16 hours", "12 hours"], "correct": [0], "context": "Using the three-point estimation technique, the final estimate (E) is calculated as: E = (a + 4*m + b) / 6, where a is the most optimistic estimate, m is the most likely estimate, and b is the most pessimistic estimate.", "perOption": ["A) Is correct. In this case, the estimate for executing a single test case is: E = (1h + 4*3h + 8h) / 6 = 3.5 hours So, the total time needed for the tester to execute 4 test cases is: 3.5h * 4 = 14 hours.", "Is not correct.", "Is not correct.", "Is not correct."], "chapter": "Chapter 5: Managing the Test Activities", "chapterNum": 5}, {"id": "D32", "text": "The table shows the traceability matrix from test cases to requirements. \"X\" means that a given test case covers the corresponding requirement.\n\nTC1: Req1, Req3, Req4, Req7\nTC2: Req1, Req5, Req7\nTC3: Req5, Req6\nTC4: Req2\n\nYou want to prioritize the test cases following the additional coverage prioritization technique. You execute all four test cases. Which test case should be executed as the LAST one?", "options": ["TC1", "TC2", "TC3", "TC4"], "correct": [1], "context": "TC1 achieves the highest coverage (4/7 – Req1, Req3, Req4 and Req7), so should be executed first. Req2, Req5 and Req6 are still not covered. The next test case that achieves the highest additional coverage of the remaining requirements is TC3, covering 2 out of these 3 requirements (Req5 and Req6). So, TC3 should be executed as the second one. Now the only requirement still not covered is Req2, which is covered by TC4. Therefore, TC4 should be executed as the third test case. So, the last test case executed will be TC2.", "perOption": ["Is not correct.", "Is correct.", "Is not correct.", "Is not correct."], "chapter": "Chapter 5: Managing the Test Activities", "chapterNum": 5}, {"id": "D33", "text": "How can the testing quadrants be beneficial for testing?", "options": ["They help in test planning by dividing the test process into four phases, corresponding to the four basic test levels: component, integration, system, and acceptance testing", "They help in assessing the high-level coverage (e.g., requirements coverage) based on low-level coverage (e.g., code coverage)", "They help non-technical stakeholders to understand the different test types and that some test types are more relevant to certain test levels than others", "They help agile teams to develop a communication strategy based on classifying people according to four basic psychological types, and on modelling the relations between them"], "correct": [2], "context": null, "perOption": ["Is not correct. Testing quadrants have nothing to do with describing the relationships between test levels", "Is not correct. Testing quadrants cannot help in assessing any type of coverage", "Is correct. Testing quadrants allow managers and other stakeholders to understand the relationships between test types, the activities they support (team support or product critique), and the viewpoint they are focused on (business- or technology-facing)", "Is not correct. Testing quadrants is not a psychological model"], "chapter": "Chapter 5: Managing the Test Activities", "chapterNum": 5}, {"id": "D34", "text": "For a given risk, its risk level is $1,000 and its risk likelihood is estimated as 50%. What is the risk impact?", "options": ["$500", "$2,000", "$50,000", "$200"], "correct": [1], "context": "Risk assessment can use a quantitative or qualitative approach, or a mix of them. In the quantitative approach the risk level is calculated as the multiplication of risk likelihood and risk impact. So, Risk level = Risk likelihood * Risk impact Then, Risk impact = Risk level / Risk likelihood. In our case, Risk impact = $1,000 / 50% = $1,000 / 0.5 = $2,000.", "perOption": ["Is not correct.", "Is correct.", "Is not correct.", "Is not correct."], "chapter": "Chapter 5: Managing the Test Activities", "chapterNum": 5}, {"id": "D35", "text": "Which of the following are product risks?", "options": ["Scope creep", "Poor architecture", "Cost-cutting", "Poor tool support", "Too long response time"], "correct": [1, 4], "context": null, "perOption": ["Is not correct. Scope creep is an example of a project risk related to technical issues", "Is correct. Poor architecture is an example of a product risk since it refers to a product characteristic", "Is not correct. Cost-cutting is an example of a project risk, related to organizational issues", "Is not correct. Poor tool support is an example of a project risk related to technical issues", "Is correct. Response time that is too long is an example of a product risk since it refers to a product characteristic"], "chapter": "Chapter 5: Managing the Test Activities", "chapterNum": 5}, {"id": "D36", "text": "Which of the following is __NOT__ a valid purpose for a test report?", "options": ["Tracking test progress and identifying areas that require further attention", "Providing information on the tests executed, their results, and defects found", "Providing information about each defect, such as the steps to reproduce it", "Providing information on testing planned for the next period"], "correct": [2], "context": null, "perOption": ["Is not correct. Tracking test progress and identifying areas that require further attention is an example of supporting the ongoing control of testing. This is one of the purposes of test reports", "Is not correct. Providing information on the tests executed, their test results, and any defects found is an example of summarizing the test activities performed at a given test level. This is one of the purposes of test reports", "Is correct. Providing information about defects is the purpose of a defect report, not a test report", "Is not correct. Providing information on testing planned for the next period is one of the purposes of test reports"], "chapter": "Chapter 5: Managing the Test Activities", "chapterNum": 5}, {"id": "D37", "text": "The user reported a software failure. An engineer from the support team asked the user for the software version number where the failure was observed. Based on the version number, the team reassembled all the files that made up the release. This later allowed a developer to perform analysis, find the defect, and fix it. Which of the following enabled the above activity to be performed by the team?", "options": ["Risk management", "Test monitoring and control", "Whole team approach", "Configuration management"], "correct": [3], "context": null, "perOption": ["Is not correct. Risk management consists of risk analysis and risk control. Neither of these activities supports the reassembly of the files that made up the release, because these activities deal with risks, not with configuration items", "Is not correct. Test monitoring is concerned with gathering information about testing. This information is used to assess test progress and to measure whether the exit criteria or the test tasks associated with the exit criteria are satisfied, such as meeting the targets for coverage of product risks, requirements, or other acceptance criteria. Test control uses the information from test monitoring to provide, in the form of control directives, guidance and the necessary corrective actions to achieve the most effective and efficient testing. None of these activities deal with the management of configuration items", "Is not correct. The whole team approach builds on the tester’s skill to work effectively in a team context and to contribute positively to the team goals. So, it focuses on team-related issues, not on configuration items", "Is correct. Configuration management provides a discipline for identifying, controlling, and tracking work products. Configuration management keeps a record of changed configuration items when a new baseline is created. Using configuration management, it is possible to revert to a previous baseline in order to reproduce previous test results"], "chapter": "Chapter 5: Managing the Test Activities", "chapterNum": 5}, {"id": "D38", "text": "Consider the following defect report for a Book Lending System.\n\nDefect ID: 001\nTitle: Unable to Return a Book\nSeverity: High\nPriority: (empty)\nEnvironment: Windows 10, Google Chrome\nDescription: When attempting to return a book using the Book Return feature, the system does not register the return and the book remains checked out to the user.\nSteps to Reproduce:\n1. Login to the Book Lending System as a user who has checked out a book.\n2. Click on the \"Book Return\" button for the book that has been checked out.\n3. System does not register the return and the book remains checked out.\nExpected Result: The book should be returned and no longer appear as checked out to the user.\nActual Result: The book remains checked out to the user and is not registered as returned in the system.\nAttachments: (none)\n\nWhich of the following is MOST likely to help the developer reproduce the failure quickly?", "options": ["Adding information about which users and which books the failure affects to the \"Description\" section", "Filling in the missing value for the \"Priority\" field", "Adding memory dumps and database snapshots taken after each step described in the \"Steps to Reproduce\" section to the \"Attachments\" section.", "Repeating the same test case for different environments and writing defect reports for each of them separately"], "correct": [0], "context": null, "perOption": ["Is correct. Adding this information allows the developer to use the same input data, so it is more likely they will be able to reproduce the failure quickly and so identify the defect faster", "Is not correct. Adding the value of Priority will not help in reproducing the defect itself", "Is not correct. Although some of this information may be of value, adding the memory dumps and database snapshots after each step will be too much, because most of these artefacts will contain useless information for the developer, and make the defect report less readable. It will also require the developer to spend a lot of time analyzing this information, which will lengthen the repair process", "Is not correct. The question was about helping the developer to reproduce the failure for a specific environment configuration"], "chapter": "Chapter 5: Managing the Test Activities", "chapterNum": 5}, {"id": "D39", "text": "Given the following test tool categories:\ni. Collaboration tools\nii. DevOps tools\niii. Management tools\niv. Non-functional testing tools\nv. Test design and implementation tools\n\nTools from which of the categories are MOST likely to facilitate test execution?", "options": ["i, v", "ii, iv", "i, iii, v", "ii, iii, iv"], "correct": [1], "context": "Considering each of the listed tool categories: Collaboration tools – facilitate communication. Communication does not include the facilitation of test execution DevOps tools - support the DevOps delivery pipeline, workflow tracking, automated build process(es) and CI/CD. The delivery pipeline and CI/CD both include the facilitation of test execution, such as component testing for CI Management tools – increase the test process efficiency by facilitating management of the SDLC, requirements, tests, defects and configuration. The management of these items does not include the facilitation of test execution Non-functional testing tools – allow the tester to perform non-functional testing that is difficult or impossible to perform manually. Non-functional testing can include both static testing and dynamic testing, including test execution Test design and implementation tools – facilitate generation of test cases, test data and test procedures. The generation of this testware does not include the facilitation of test execution", "perOption": ["Is not correct.", "Is correct. Both DevOps tools (ii) and Non-functional testing tools (iv) facilitate test execution.", "Is not correct.", "Is not correct."], "chapter": "Chapter 6: Test Tools", "chapterNum": 6}, {"id": "D40", "text": "Which of the following is MOST likely to be a risk of test automation?", "options": ["The detection of additional high-severity defects", "Providing measures that are too complicated for humans to derive", "Incompatibility with the development platform", "Substantially reduced test execution times"], "correct": [2], "context": null, "perOption": ["Is not correct. The detection of additional high-severity defects would be a benefit of test automation, rather than a risk", "Is not correct. The provision of measures that are too complicated for humans to derive themselves is normally considered to be a benefit of test automation", "Is correct. If the test automation is incompatible with the development platform, then it will not be able to integrate them, and, for instance, pass test inputs to the test object and receive test results from the test object", "Is not correct. Substantially reduced test execution times would normally be considered a benefit that is provided by test automation"], "chapter": "Chapter 6: Test Tools", "chapterNum": 6}];

const EXAMS = {
  A: { name: 'Exam A', questions: DATA_A, current: 0, answers: new Array(DATA_A.length).fill(null), examActive: false, timerSeconds: 0, timerInterval: null },
  B: { name: 'Exam B', questions: DATA_B, current: 0, answers: new Array(DATA_B.length).fill(null), examActive: false, timerSeconds: 0, timerInterval: null },
  C: { name: 'Exam C', questions: DATA_C, current: 0, answers: new Array(DATA_C.length).fill(null), examActive: false, timerSeconds: 0, timerInterval: null },
  D: { name: 'Exam D', questions: DATA_D, current: 0, answers: new Array(DATA_D.length).fill(null), examActive: false, timerSeconds: 0, timerInterval: null },
};
let activeExam = 'A';
let selected = [];

function ex(){ return EXAMS[activeExam]; }

const pipelineEl = document.getElementById('pipeline');
const panelEl = document.getElementById('panel');
const progressLabel = document.getElementById('progressLabel');
const prevBtn = document.getElementById('prevBtn');
const nextArrowBtn = document.getElementById('nextArrowBtn');
const examLabel = document.getElementById('examLabel');
const tabA = document.getElementById('tabA');
const tabB = document.getElementById('tabB');
const tabC = document.getElementById('tabC');
const tabD = document.getElementById('tabD');
const tabButtons = { A: tabA, B: tabB, C: tabC, D: tabD };

// --- timer ---
const timerDisplay = document.getElementById('timerDisplay');
const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');

function formatTime(s){
  const m = Math.floor(s / 60).toString().padStart(2, '0');
  const sec = (s % 60).toString().padStart(2, '0');
  return `${m}:${sec}`;
}

function refreshTimerUI(){
  const e = ex();
  timerDisplay.textContent = formatTime(e.timerSeconds);
  startBtn.classList.toggle('active', !!e.timerInterval);
  stopBtn.classList.toggle('active', !e.timerInterval && e.timerSeconds > 0);
}

function startTimerFor(key){
  const e = EXAMS[key];
  if (e.timerInterval) return;
  e.timerInterval = setInterval(() => {
    e.timerSeconds++;
    if (activeExam === key) timerDisplay.textContent = formatTime(e.timerSeconds);
  }, 1000);
  if (activeExam === key) refreshTimerUI();
}

function stopTimerFor(key){
  const e = EXAMS[key];
  clearInterval(e.timerInterval);
  e.timerInterval = null;
  if (activeExam === key) refreshTimerUI();
}

startBtn.onclick = () => {
  startTimerFor(activeExam);
  ex().examActive = true;
  renderQuestion();
};
stopBtn.onclick = () => {
  stopTimerFor(activeExam);
  ex().examActive = false;
  renderReport();
};

function switchExam(key){
  if (activeExam === key) return;
  activeExam = key;
  selected = [];
  Object.keys(tabButtons).forEach(k => tabButtons[k].classList.toggle('active', k === key));
  examLabel.textContent = `CTFL v4.0 // sample ${ex().name}`;
  refreshTimerUI();
  renderQuestion();
}
tabA.onclick = () => switchExam('A');
tabB.onclick = () => switchExam('B');
tabC.onclick = () => switchExam('C');
tabD.onclick = () => switchExam('D');

function esc(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function richText(s){
  let out = esc(s);
  out = out.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  out = out.replace(/\*(.+?)\*/g, '<em>$1</em>');
  out = out.replace(/__(.+?)__/g, '<u>$1</u>');
  return out;
}

function letter(i){ return String.fromCharCode(65+i); }

function chapterVars(num){
  return `--ch-color:var(--ch${num});--ch-bg:var(--ch${num}-bg);`;
}

function renderPipeline(){
  const e = ex();
  pipelineEl.innerHTML = '';
  e.questions.forEach((q, i) => {
    const btn = document.createElement('button');
    btn.className = 'stage';
    btn.textContent = i + 1;
    const a = e.answers[i];
    if (a) btn.classList.add(a.correct ? 'pass' : 'fail');
    if (i === e.current) btn.classList.add('active');
    btn.title = q.chapter;
    btn.onclick = () => goTo(i);
    pipelineEl.appendChild(btn);
  });
  progressLabel.textContent = `${e.current + 1} / ${e.questions.length}`;
  prevBtn.disabled = e.current === 0;
  nextArrowBtn.disabled = e.current === e.questions.length - 1;
}

function goTo(i){
  const e = ex();
  if (i < 0 || i >= e.questions.length) return;
  e.current = i;
  renderQuestion();
}

prevBtn.onclick = () => goTo(ex().current - 1);
nextArrowBtn.onclick = () => goTo(ex().current + 1);

function renderQuestion(){
  selected = [];
  const e = ex();
  const q = e.questions[e.current];
  const isMulti = q.correct.length > 1;
  const saved = e.answers[e.current];
  renderPipeline();

  panelEl.innerHTML = `
    <div class="chapter-tag" style="${chapterVars(q.chapterNum)}">${esc(q.chapter)}</div>
    <div class="tag"><span>${esc(q.id)}</span><span>${isMulti ? `choose ${q.correct.length}` : 'single choice'}</span></div>
    <p class="qtext">${richText(q.text)}</p>
    ${q.image ? `<div class="qimage"><img src="${q.image}" alt="diagram"></div>` : ''}
    ${!e.examActive && !saved ? '<div class="lock-hint">Натисніть <strong>Start</strong>, щоб почати тестування</div>' : ''}
    <div class="options" id="optionsWrap"></div>
    ${isMulti && !saved && e.examActive ? '<button class="submit-btn" id="submitBtn">CONFIRM</button>' : ''}
    <div class="explain" id="explain"></div>
    <div class="footer-row">
      <div class="verdict" id="verdict"></div>
      <button class="next-btn" id="nextBtn">NEXT →</button>
    </div>
  `;

  const wrap = document.getElementById('optionsWrap');
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = `<span class="k">${letter(i)}</span><span>${richText(opt)}</span>`;
    if (saved){
      btn.disabled = true;
      const wasChosen = saved.chosen.includes(i);
      const isRight = q.correct.includes(i);
      if (isRight) btn.classList.add('correct');
      else if (wasChosen) btn.classList.add('wrong');
    } else if (!e.examActive){
      btn.disabled = true;
    } else {
      btn.onclick = () => isMulti ? toggleAnswer(i, btn) : submitAnswer([i]);
    }
    wrap.appendChild(btn);
  });

  if (isMulti && !saved && e.examActive){
    document.getElementById('submitBtn').onclick = () => {
      if (selected.length > 0) submitAnswer(selected);
    };
  }

  if (saved){
    const verdict = document.getElementById('verdict');
    verdict.textContent = saved.correct ? 'PASS' : 'FAIL — correct answer(s) highlighted';
    verdict.classList.add(saved.correct ? 'pass' : 'fail');

    const explainEl = document.getElementById('explain');
    let contextP = '';
    if (Array.isArray(q.context)){
      contextP = q.context.map(c => `<p><strong>${esc(c.label)}.</strong> ${richText(c.text)}</p>`).join('');
    } else if (q.context){
      contextP = `<p>${richText(q.context)}</p>`;
    }
    const paragraphs = q.perOption.map((p, i) => `<p><strong>${letter(i)})</strong> ${richText(p)}</p>`).join('');
    explainEl.innerHTML = `<span class="explain-label">EXPLANATION</span>${contextP}${paragraphs}`;
    explainEl.classList.add('show');
  }

  document.getElementById('nextBtn').classList.toggle('show', !!saved && e.current < e.questions.length - 1);
  document.getElementById('nextBtn').onclick = () => goTo(e.current + 1);
}

function toggleAnswer(i, btn){
  const pos = selected.indexOf(i);
  if (pos === -1){ selected.push(i); btn.classList.add('selected'); }
  else { selected.splice(pos, 1); btn.classList.remove('selected'); }
  document.getElementById('submitBtn').classList.toggle('show', selected.length > 0);
}

function submitAnswer(chosen){
  const e = ex();
  const q = e.questions[e.current];
  const chosenSet = new Set(chosen);
  const correctSet = new Set(q.correct);
  const isCorrect = chosenSet.size === correctSet.size &&
    [...chosenSet].every(v => correctSet.has(v));
  e.answers[e.current] = { chosen: [...chosenSet], correct: isCorrect };
  renderQuestion();
}

function renderReport(){
  const e = ex();
  const answered = e.answers.filter(Boolean);
  const answeredCount = answered.length;
  const passed = answered.filter(a => a.correct).length;

  if (answeredCount === 0){
    panelEl.innerHTML = `
      <div class="report">
        <div class="label">TEST RUN STOPPED</div>
        <div class="label" style="margin-top:14px;">Ви ще не відповіли на жодне питання</div>
        <button class="restart-btn" id="restartBtn">RUN AGAIN ↻</button>
      </div>
    `;
    document.getElementById('restartBtn').onclick = resetExam;
    return;
  }

  const rate = Math.round((passed/answeredCount)*100);
  let cls = 'fail';
  if (rate >= 80) cls = 'pass';
  else if (rate >= 50) cls = 'warn';

  panelEl.innerHTML = `
    <div class="report">
      <div class="label">TEST RUN STOPPED</div>
      <div class="rate ${cls}">${rate}%</div>
      <div class="label">correct out of answered</div>
      <div class="breakdown">
        <div><span class="n" style="color:var(--pass)">${passed}</span>correct</div>
        <div><span class="n">${answeredCount}</span>answered</div>
        <div><span class="n">${e.questions.length}</span>total questions</div>
      </div>
      <button class="restart-btn" id="restartBtn">RUN AGAIN ↻</button>
    </div>
  `;
  document.getElementById('restartBtn').onclick = resetExam;
}

function resetExam(){
  const e = ex();
  e.current = 0;
  e.answers.fill(null);
  e.examActive = false;
  stopTimerFor(activeExam);
  e.timerSeconds = 0;
  refreshTimerUI();
  renderQuestion();
}

renderQuestion();
</script>
</body>
