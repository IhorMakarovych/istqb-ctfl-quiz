aving a larger number of tests at the lower test levels", "Is not correct. It is not true that a test on a lower level tests a larger piece of functionality. Tests are more atomic and oriented on a specific logic, so it is the opposite", "Is not correct. Test pyramid shows how the number of tests is distributed across test levels", "Is not correct. The test pyramid model supports the team in test automation"], "chapter": "Chapter 5: Managing the Test Activities", "chapterNum": 5}, {"id": "A22", "text": "During risk analysis the team considered the following risk: \"*The system allows too high a discount for a customer*\". The team estimated the risk impact to be very high. What can one say about the risk likelihood?", "options": ["It is also very high. High risk impact always implies high risk likelihood", "It is very low. High risk impact always implies low risk likelihood", "One cannot say anything about risk likelihood. Risk impact and risk likelihood are independent.", "Risk likelihood is not important with such a high-risk impact. One does not need to define it."], "correct": [2], "context": null, "perOption": ["Is not correct. Risk impact and risk likelihood are independent", "Is not correct. Risk impact and risk likelihood are independent", "Is correct. Risk impact and risk likelihood are independent", "Is not correct. We need both factors to calculate risk level"], "chapter": "Chapter 5: Managing the Test Activities", "chapterNum": 5}, {"id": "A23", "text": "The following list contains risks that have been identified for a new software product to be developed:\ni. Management moves two experienced testers to another project\nii. The system does not comply with security standards\niii. System response time exceeds user requirements\niv. Stakeholders have inaccurate expectations\nv. Disabled people have problems when using the system\n\nWhich of them are project risks?", "options": ["i, iv are project risks", "iv, v are project risks", "i, iii are project risks", "ii, v are project risks"], "correct": [0], "context": "Consider: It is a Project risk It is a Product risk It is a Product risk It is a Project risk It is a Product risk", "perOption": ["Is correct.", "Is not correct.", "Is not correct.", "Is not correct."], "chapter": "Chapter 5: Managing the Test Activities", "chapterNum": 5}, {"id": "A24", "text": "Which of the following is an example of how product risk analysis influences thoroughness and scope of testing?", "options": ["The test manager monitors and reports the level of all known risks on a daily basis so the stakeholders can make an informed decision on the release date", "One of the identified risks was \"*Lack of support of open-source databases*\", so the team decided to integrate the system with an open-source database", "During the quantitative risk analysis, the team estimated the total level of all identified risks and reported it as the total residual risk before testing", "Risk assessment revealed a very high level of performance risks, so it was decided to perform detailed performance efficiency testing early in the SDLC"], "correct": [3], "context": null, "perOption": ["Is not correct. This is an example of a risk monitoring activity, not risk analysis", "Is not correct. This is an example of an architectural decision, not related with testing", "Is not correct. This is an example of performing a quantitative risk analysis and is not related to thoroughness or scope of testing", "Is correct. This shows how risk analysis impacts the thoroughness of testing (i.e., the level of detail)"], "chapter": "Chapter 5: Managing the Test Activities", "chapterNum": 5}, {"id": "A25", "text": "Which TWO of the following options are common metrics used for reporting on the quality level of the test object?", "options": ["Number of defects found during system testing", "Total effort on test design divided by the number of designed test cases", "Number of executed test procedures", "Number of defects found divided by the size of a work product", "Time needed to repair a defect"], "correct": [0, 3], "context": null, "perOption": ["Is correct. The number of defects found is related to the test object quality", "Is not correct. This is the measure of the test efficiency not the test object quality", "Is not correct. The number of test cases executed does not tell us anything about the quality; test results might do", "Is correct. defect density is related to the test object quality", "Is not correct. Time to repair is a process metric. It does not tell us anything about the product quality"], "chapter": "Chapter 5: Managing the Test Activities", "chapterNum": 5}, {"id": "A26", "text": "Which of the following pieces of information contained in a test progress report is the LEAST useful for business representatives?", "options": ["Impediments to testing", "Branch coverage achieved", "Test progress", "New risks within the test cycle"], "correct": [1], "context": null, "perOption": ["Is not correct. Impediments to testing can be high-level and business-related, so this is an important piece of information for business stakeholders", "Is correct. Branch testing is a technical metric used by developers and technical test analysts. This information is of no interest to business representatives", "Is not correct. Test progress is project related, so it may be useful for business representatives", "Is not correct. Risks impact product quality, so it may be useful for business representatives"], "chapter": "Chapter 5: Managing the Test Activities", "chapterNum": 5}, {"id": "Q39", "text": "Which test activity does a data preparation tool support?", "options": ["Test monitoring and test control", "Test analysis", "Test design and test implementation", "Test completion"], "correct": [2], "context": null, "perOption": ["Is not correct. Test monitoring involves the ongoing checking of all activities and comparison of actual progress against the test plan. Test control involves taking the actions necessary to meet the test objectives of the test plan. No test data are prepared during these activities.", "Is not correct. Test analysis includes analysis of the test basis to identify test conditions and prioritize them. Test data are not prepared during this activity.", "Is correct. Test design and implementation can both include the identification, creation or acquisition of the testware necessary for test execution (e.g., test data).", "Is not correct. Test completion activities occur at project milestones (e.g., release, end of iteration, test level completion), so it is too late for preparing test data."], "chapter": "Chapter 6: Test Tools", "chapterNum": 6}, {"id": "Q40", "text": "Which item correctly identifies a potential risk of performing test automation?", "options": ["It may introduce unknown regressions in production", "Sufficient efforts to maintain testware may not be properly allocated", "Testing tools and associated testware may not be sufficiently relied upon", "It may reduce the time allocated for manual testing"], "correct": [1], "context": null, "perOption": ["Is not correct. Test automation does not introduce unknown regressions in production", "Is correct. Wrong allocation of effort to maintain testware is a risk", "Is not correct. Test tools must be selected so that they and their testware can be relied upon", "Is not correct. The primary goal of test automation is to reduce manual testing. So, this is a benefit, not a risk"], "chapter": "Chapter 6: Test Tools", "chapterNum": 6}];
const DATA_B = [{"id": "B1", "text": "Which of the following is an example of why testing is necessary?", "options": ["Dynamic testing increases quality by causing test objects to fail in ways that could never be achieved by the users", "Static testing is used by developers to identify failures in their code earlier than can be achieved through dynamic testing", "Static analysis provides evidence to customers that the elements of the system that provide no outputs are fit for release", "Reviews increase the quality of requirements specifications and lead to fewer changes being needed in derived work products"], "correct": [3], "context": null, "perOption": ["Is not correct. It is often possible to use dynamic testing to cause a test object to fail in ways that could never be achieved by the users, such as by using fault injection. However, if the failure can never occur with real end users, then identifying it is not especially valuable as testing is ultimately aimed at improving the work product for the end users. Spending time testing for failures that cannot occur with real users is not an efficient use of a tester’s time", "Is not correct. Static testing in the form of static analysis is used by developers to identify defects in their code earlier than can be achieved through dynamic testing. Note, however, that static testing (and static analysis) is used to detect defects, not failures, which are found by dynamic testing. Thus it is the use of the term ‘failures’ that makes this an incorrect option", "Is not correct. Static analysis directly detects defects in code, and this is normally information for the developer, not the customer.", "Is correct. Reviews are a form of static testing that can be applied from the very start of the software development lifecycle and are used to find defects that can be removed before subsequent development activities waste effort on faulty requirements. If the defects are not detected and removed early on, then when the defect is found in derived work products, such as the design and code, the requirements will need to be changed."], "chapter": "Chapter 1: Fundamentals of Testing", "chapterNum": 1}, {"id": "B2", "text": "Which of the following statements about quality assurance (QA) and/or quality control (QC) is correct?", "options": ["QA is performed as part of testing", "Testing is performed as part of QC", "Testing is another term for QC", "Testing is performed as part of QA"], "correct": [1], "context": null, "perOption": ["Is not correct. QA concentrates on process improvement and implementation, using a preventive approach to avoid errors and defects, while testing is a form of QC that is used to detect defects", "Is correct. QC aims to achieve appropriate levels of quality by focusing on identifying and correcting product defects. Testing is a significant part of QC and helps to uncover these defects", "Is not correct. Although testing is a significant part of QC and helps to uncover defects, other (non-testing) techniques utilized in QC include formal methods like model checking and proof of correctness, as well as simulation and prototyping", "Is not correct. QA concentrates on process improvement and implementation, using a preventive approach to avoid errors and defects, while testing is a form of QC that is used to detect defects"], "chapter": "Chapter 1: Fundamentals of Testing", "chapterNum": 1}, {"id": "B3", "text": "One of the 'principles of testing' states that exhaustive testing is impossible. Which of the following is an example of addressing this principle in practice?", "options": ["Creating test cases that cover every possible specified output", "Documenting all possible test input variations and prioritizing these based on importance", "Starting testing as early as possible with reviews and other static testing approaches", "Using equivalence partitioning and boundary value analysis to generate test cases"], "correct": [3], "context": "The ‘exhaustive testing is impossible’ principle is concerned with the fact that it is not feasible to test every possible variation of inputs in all different circumstances, except in trivial cases. Instead, testing utilizes test techniques, test case prioritization, and risk-based testing to sample from the set of possibilities and focus test efforts.", "perOption": ["Is not correct. The principle states that it is not feasible to test everything except in trivial cases. Testing everything would require testing every possible variation of inputs in all different circumstances, which is generally infeasible as there will be a practically infinite number of possibilities. Testing every possible expected result will not address this problem as the relationship between inputs and expected results can be different for each test object. Sometimes there may be a practically infinite number of possible expected results (e.g., when there are several variables representing real numbers), whereas at other times there may be just two expected results, such as with a single variable that can be either true or false", "Is not correct. The principle states that it is not feasible to test every possible variation of inputs in all different circumstances. This is because for non-trivial systems there is a practically infinite number. Therefore, in practice, documenting all possible input variations would be impractical as it would take an infinite length of time", "Is not correct. Starting testing as early as possible with reviews and other static testing approaches will not address the problem of there being too many possible test cases. The ‘early testing saves time and money’ principle is concerned with fixing defects early on to prevent the occurrence of subsequent defects in derived work products, thereby reducing costs and the likelihood of failures", "Is correct. The use of equivalence partitioning and boundary value analysis to generate test cases is one way to address the principle as these test techniques provide a systematic way to derive a finite subset of all possible test cases"], "chapter": "Chapter 1: Fundamentals of Testing", "chapterNum": 1}, {"id": "B4", "text": "Which test activity involves working with test data requirements, test conditions, test environment requirements and test cases?", "options": ["Test design", "Test execution", "Test analysis", "Test implementation"], "correct": [0], "context": null, "perOption": ["Is correct. Test design involves using test conditions to create test cases and other necessary testware, such as test data requirements and test charters for exploratory testing. Test environment requirements are also specified, including the necessary infrastructure and tools", "Is not correct. Test execution involves executing test cases (as part of test procedures), however it does not directly cover the other testware mentioned in the question, such as test data requirements, test environment requirements and test conditions", "Is not correct. Test analysis is used to identify the features that require testing. The test basis is analyzed and defined as test conditions, which are then prioritized along with related risks. While this activity involves working with test conditions, it does not cover the other testware mentioned in the question, such as test data requirements, test environment requirements and test cases", "Is not correct. Test implementation includes the generation of test procedures, such as manual and automated test scripts, which are created from test cases and may be assembled into test suites. Test procedures are prioritized and arranged in a test execution schedule. Test data is created, and the test environment built, and its set up verified. While this activity involves explicitly working with test cases, and may use test data requirements and test environment requirements to create test data and the test environment, it does not cover test conditions"], "chapter": "Chapter 1: Fundamentals of Testing", "chapterNum": 1}, {"id": "B5", "text": "Which of the following is MOST likely to impact how testing is performed for a given test object?", "options": ["The average level of experience of the organization's marketing team", "The knowledge of users that a new system is being developed for them", "The number of years' experience of the members of the test team", "The end user's organizational structure for a commercial music streaming application"], "correct": [2], "context": null, "perOption": ["Is not correct. The organization’s marketing team is unlikely to perform much testing (although in some organizations they may be involved with acceptance testing), so their average level of experience (most of which would be in marketing) is not likely to impact how testing is performed for a given test object", "Is not correct. The level of knowledge of users that a new system is being built for them is unlikely to affect how testing is performed. Any user involvement that could affect how testing is performed is more likely to be as a result of decisions made by the testers, customer and project manager", "Is correct. The number of years’ experience of the members of the performance efficiency testing team will help to determine the capabilities and knowledge (e.g., of different tools and defect types) that the team members will apply when they are testing", "Is not correct. The organizational structure of the different end users (who may be varied) will change between users. So, it may not even be known when the application is being tested, and the end user’s organizational structure can thus have little effect on how the testing is performed"], "chapter": "Chapter 1: Fundamentals of Testing", "chapterNum": 1}, {"id": "B6", "text": "Which of the following statements is a CORRECT example of the value of traceability?", "options": ["Traceability between the mitigated risks and test cases that passed provides a means of determining the level of residual risk", "Traceability between user requirements and test results provides a means of measuring project progress against business goals", "Traceability between testers and test cases that failed provides a means of determining the skill level of the testers", "Traceability between the identified risks and written test conditions provides a means of determining which risks are worth testing"], "correct": [1], "context": null, "perOption": ["Is not correct. Traceability between the mitigated risks and test cases that passed provides little information, because to be mitigated (by testing) the risks would need to have a corresponding test case that passed. To be able to assess residual risk, traceability between all risks and test results needs to be available, so that the risks that do not have a corresponding passing test can be identified as the residual risks", "Is correct. Traceability between user requirements and test results provides an indication of which user requirements have been tested and so provides a means of measuring project progress (in the context of testing) against business goals", "Is not correct. It is not clear that test cases that failed provide an indication of tester’s skills any more than test cases that passed. It would partly depend on the test objective (e.g., building confidence or causing failures). Also, such measurement of testers based on test cases that passed and failed can be counter-productive as it could cause the testers to optimize their testing based on that metric rather than the test objective", "Is not correct. Traceability between the identified risks and written test conditions provides a means of determining which further test conditions need to be written. Determining which risks are worth testing is part of risk management, and risk mitigation in particular"], "chapter": "Chapter 1: Fundamentals of Testing", "chapterNum": 1}, {"id": "B7", "text": "Which of the following is MOST likely to be an example of a tester using a generic skill when testing?", "options": ["The tester's deep knowledge of a variety of computer games meant that they got on well with one of the developers who was also into gaming", "The tester was a former pilot and was better able to understand the acceptance criteria for the helicopter control system", "The tester previously worked as a programmer and used their skills in this area to better communicate with the business analysts", "The tester was very careful not to make mistakes when they methodically generated test cases prior to starting their exploratory testing session"], "correct": [1], "context": null, "perOption": ["Is not correct. Strong communication skills, active listening, and teamwork abilities enable a tester to interact effectively with all stakeholders, however a deep knowledge of a variety of computer games that allowed them to get on well with one developer is not an example of a generic skill useful to testers", "Is correct. Domain knowledge that can be used to understand and communicate with end-users and business representatives is one of the generic skills required by testers. A tester with experience as a pilot would make them better able to appreciate the acceptance criteria for the helicopter control system", "Is not correct. Although programming skills could be considered as technical knowledge which can increase efficiency when utilizing some test tools, it is unlikely that these skills would improve their communication with business analysts", "Is not correct. Although thoroughness, attention to detail, curiosity, and a methodical approach to identifying hard-to-find defects are all useful generic skills for testers, it is doubtful they would be generating test cases prior to starting exploratory testing. This is because one of the main tenets of exploratory testing is that the test cases are generated during the testing, not scripted in advance"], "chapter": "Chapter 1: Fundamentals of Testing", "chapterNum": 1}, {"id": "B8", "text": "Which of the following is an advantage of the whole-team approach?", "options": ["It allows team members to take on any role at any time", "It only needs a single team to support the complete development project", "It embeds business representatives alongside developers in the same team", "It generates a team synergy that benefits the entire project"], "correct": [3], "context": null, "perOption": ["Is not correct. The whole-team approach allows any team member with the requisite skills and knowledge to undertake any task, however that does not mean that team members can take on any role at any time. Typically, they only take on roles in which they are competent, and there is no suggestion that every team member can do every role", "Is not correct. The whole-team approach applies to how a single team (typically in Agile software development) works; it does not cover how multiple teams are supposed to work on larger projects, and it does not suggest that only one ‘whole’ team is needed for a complete project", "Is not correct. The whole-team approach does not expect every team member to be involved in every important decision. For instance, there is no need for the business representative (i.e., the Product Owner) to be involved in every technical decision that does not affect the business outcome and implementing such an approach would unnecessarily slow down the team’s progress", "Is correct. By leveraging the diverse skill sets of each team member most effectively, the whole-team approach fosters superior team dynamics, promotes robust communication and collaboration, and generates a team synergy that benefits the entire project"], "chapter": "Chapter 1: Fundamentals of Testing", "chapterNum": 1}, {"id": "B9", "text": "Which of the following statements about the chosen software development lifecycle is CORRECT?", "options": ["If agile software development is used, automation of system tests replaces the need for regression testing", "If a sequential development model is used, then the dynamic testing is typically restricted to later in the lifecycle", "If an iterative development model is used, then component testing is typically performed manually by developers", "If an incremental development model is used, then static testing is done in early increments and dynamic testing in later increments"], "correct": [1], "context": null, "perOption": ["Is not correct. In agile software development, deliverables are produced in each iteration, and the frequent delivery of increments necessitates extensive regression testing. Although some (or all) of this regression testing may be automated, the regression testing (automated or not) cannot be replaced by automation of system tests", "Is correct. If a sequential development model is used, then early in the software development lifecycle no code is available for execution, and so during this time static testing (e.g., reviews) is performed. Later in the lifecycle, when code is available for execution, dynamic testing is possible. Note, however, that preparation for dynamic testing will often occur early in any software development lifecycle", "Is not correct. If an iterative development model, like agile software development, is used, then component tests may well be used for regression testing for each iteration. In which case, there is a strong argument for automating these component tests, which will have to be run frequently, and there is unlikely to be a strong argument for developers performing these component tests manually", "Is not correct. In most incremental development models, deliverables are produced in each increment, requiring both static testing and dynamic testing at all test levels for each increment delivered"], "chapter": "Chapter 2: Testing Throughout the SDLC", "chapterNum": 2}, {"id": "B10", "text": "Which of the following is a good testing practice that applies to all software development lifecycles?", "options": ["Testers should review work products as part of the next development phase", "Testers should review work products as soon as drafts are available", "Testers should review work products before test analysis and test design begin", "Testers should review work products immediately after they are published"], "correct": [1], "context": null, "perOption": ["Is not correct. Testers should review work products as soon as drafts are available to enable early testing as part of a shift-left approach. If they waited until the next development phase, then unnecessary development (and test) work could be started on unreviewed, flawed work products", "Is correct. Testers should review work products as soon as drafts are available to enable early testing as part of a shift-left approach", "Is not correct. Testers typically review work products that form the test basis as part of test analysis, not before test analysis and test design", "Is not correct. Testers should review work products as soon as drafts are available to enable early testing as part of the shift-left approach. Waiting until they are published means that any defects that could be found by tester’s review will be in the published document"], "chapter": "Chapter 2: Testing Throughout the SDLC", "chapterNum": 2}, {"id": "B11", "text": "Which of the following is an example of a test-first approach to development?", "options": ["Test-Driven Development", "Coverage-Driven Development", "Quality-Driven Development", "Feature-Driven Development"], "correct": [0], "context": null, "perOption": ["Is correct. Test-Driven Development (TDD) is a well-known example of a test-first approach to development", "Is not correct. Coverage-Driven Development is not a correct example of a test-first approach to development", "Is not correct. Quality-Driven Development is not a correct example of a test-first approach to development", "Is not correct. Feature-Driven Development is not an example of a test-first approach to development, but is, instead, an agile software development methodology based around delivering features (as opposed to user stories in Scrum)"], "chapter": "Chapter 2: Testing Throughout the SDLC", "chapterNum": 2}, {"id": "B12", "text": "Which of the following statements about DevOps is CORRECT?", "options": ["To speed up releases, continuous integration is used to encourage developers to submit code quickly without the need to complete component testing", "To be able to update and release systems on a more frequent basis, many automated regression tests are required to reduce the risk of regression", "To treat both developers and operations equally, the testers will allocate more effort to release testing by operations using a shift-right approach", "To create increased synergy between testers, developers and operations, the testing must become fully automated with no manual testing"], "correct": [1], "context": null, "perOption": ["Is not correct. DevOps enhances testing in several ways, such as by providing fast feedback on code quality, automated regression testing that minimizes regression risk, and promoting a shift-left approach with high-quality code submission and component tests. This is largely provided through continuous integration, where the developers submit component (unit) tests with their new code, which must pass for the code to be admitted to the build. Therefore, developers do need to complete component testing", "Is correct. DevOps enhances testing in several ways, such as by providing fast feedback on code quality, automated regression testing that minimizes regression risk, and promoting a shift-left approach with high-quality code submission and component tests", "Is not correct. DevOps enhances testing in several ways, such as by providing fast feedback on code quality, automated regression testing that minimizes regression risk, and promoting a shift-left approach with high-quality code submission and component tests. Testers do not attempt to treat developers and operations equally by spending more time on release testing, although a shift-right approach to testing (testing in production) may well be used", "Is not correct. Automated processes like continuous integration/continuous delivery (CI/CD) in DevOps facilitate stable test environments and reduce the need for manual testing, however, there is a risk of overlooking the importance of manual testing, especially from a user's perspective"], "chapter": "Chapter 2: Testing Throughout the SDLC", "chapterNum": 2}, {"id": "B13", "text": "Which of the following is MOST likely to be performed as part of system testing?", "options": ["Security testing of a credit management system by an independent test team", "Testing the interface of a currency exchange system with an external banking system", "Beta testing of a remote learning system by courseware developers", "Testing interactions between the user interface and database of a human resources system"], "correct": [0], "context": null, "perOption": ["Is correct. System testing examines the behavior and capabilities of the complete system and covers non-functional testing of quality characteristics, which includes security testing. This type of testing is often performed by an independent test team based on system specifications", "Is not correct. System integration testing examines the interfaces with other systems and external services", "Is not correct. Beta testing is a type of acceptance testing performed at an external site by roles outside the development organization", "Is not correct. Component integration testing involves testing the (interfaces and) interactions between components of a system, such as the user interface and database"], "chapter": "Chapter 2: Testing Throughout the SDLC", "chapterNum": 2}, {"id": "B14", "text": "Which of the following statements is CORRECT?", "options": ["Regression tests increase in number as the project progresses, whereas the number of confirmation tests decreases as the project progresses", "Regression tests are created and run when the test object is fixed, whereas confirmation tests are run whenever the test object is enhanced", "Regression testing is concerned with checking that the operational environment remains unchanged, whereas confirmation testing is concerned with testing changes to the test object", "Regression testing is concerned with adverse effects in unchanged code, whereas confirmation testing is concerned with testing changed code"], "correct": [3], "context": null, "perOption": ["Is not correct. Regression tests increase in number as the project progresses, as new regression tests are typically required as changes are made to the system. Similarly, the number of confirmation tests also typically increases as the project progresses as new confirmation tests are needed for each fix made to a system", "Is not correct. It is the other way round. Confirmation tests are created and run when the test object is fixed, and regression tests are (ideally) run whenever the test object is enhanced (changed)", "Is not correct. Confirmation testing verifies that a defect has been fixed correctly and so is concerned with testing changes to the test object. However, regression testing ensures that changes (including changes to the operational environment) do not have negative effects on unchanged software and so does not check that the operational environment remains unchanged", "Is correct. Regression testing ensures that changes do not have negative effects on unchanged software. Confirmation testing verifies that a defect has been fixed – and so is concerned with changed code"], "chapter": "Chapter 2: Testing Throughout the SDLC", "chapterNum": 2}, {"id": "B15", "text": "Which of the following is an example of a defect that can be found by static testing but __NOT__ by dynamic testing?", "options": ["Lack of usability provided through the user interface", "Code with no path that reaches it", "Poor response times for most of the expected users", "Required features that are not implemented in the code"], "correct": [1], "context": null, "perOption": ["Is not correct. A lack of usability provided through the user interface can be detected through a review using a suitable checklist, but the lack of usability can also be identified by getting several typical users to dynamically test the user interface and provide feedback on its usability", "Is correct. A code review can detect code that cannot be reached by any path, however dynamic tests can only exercise reachable code and cannot determine that code cannot be reached without running every possible combination of inputs and input states, which is impractical for real code", "Is not correct. Poor response times for most of the expected users are difficult to determine without executing the code (i.e., by static testing), so in this situation dynamic testing could find a defect, but static testing is unlikely to find it", "Is not correct. A review of the code by someone who is aware of the required features could detect that the required features had not been implemented in the code, and dynamic testing could also be used to determine that these required features had not been implemented"], "chapter": "Chapter 3: Static Testing", "chapterNum": 3}, {"id": "B16", "text": "Which of the following is a benefit of early and frequent stakeholder feedback?", "options": ["Managers are aware of which developers are less productive", "It allows project managers to prioritize their stakeholder interactions", "It facilitates early communication of potential quality issues", "End users better understand why the delivery of the work product is delayed"], "correct": [2], "context": null, "perOption": ["Is not correct. The feedback is from stakeholders (e.g., business representatives and end users), not from developers, so this feedback is not likely to inform managers which developers are more or less productive", "Is not correct. Early and frequent feedback from stakeholders is not used by project managers to prioritize how they interact with the different stakeholders", "Is correct. Obtaining feedback from stakeholders early and often in the software development process can be highly beneficial as it facilitates early communication of potential quality issues, can prevent misunderstandings about requirements, and ensures that any changes in stakeholder requirements are understood and implemented sooner", "Is not correct. Early and frequent feedback can prevent the development of a product that does not meet stakeholder needs, and results in costly rework and missed deadlines, so, ideally there should be no delay. Also, the feedback is from stakeholders (not to them), which includes the end users, so the end users providing feedback will not aid the end users’ understanding"], "chapter": "Chapter 3: Static Testing", "chapterNum": 3}, {"id": "B17", "text": "Given the following task descriptions:\n1. The quality characteristics to be evaluated and the exit criteria are selected\n2. Everyone has access to the work product\n3. Anomalies are identified in the work product\n4. Anomalies are discussed\n\nAnd the following review activities\nA. Individual review\nB. Review initiation\nC. Planning\nD. Communication and analysis\n\nWhich of the following BEST matches the task descriptions and activities?", "options": ["1B, 2C, 3D, 4A", "1B, 2D, 3C, 4A", "1C, 2A, 3B, 4D", "1C, 2B, 3A, 4D"], "correct": [3], "context": "Considering each of the listed task descriptions: The quality characteristics to be evaluated and the exit criteria are selected - (Planning (C): Defining the review scope, purpose, work product to be reviewed, quality characteristics to be evaluated, areas of focus, exit criteria, supporting information such as standards, effort, and timeframes.) Everyone has access to the work product - (Review initiation (B): Ensuring all participants have access to the work product and necessary resources, and clarifying their roles and responsibilities.) Anomalies are identified in the work product - (Individual review (A): Evaluating the work product's quality, identifying and logging anomalies, recommendations, and questions using review techniques like checklist-based reviewing and scenario-based reviewing.) Anomalies are analyzed and discussed - (Communication and analysis (D): Analyzing and discussing each anomaly, determining its status, ownership, and required actions, and making review decisions, normally in a meeting. This could include determining the need for a follow-up review.)", "perOption": ["Is not correct.", "Is not correct.", "Is not correct.", "Is correct. The correct match is: 1C, 2B, 3A, 4D."], "chapter": "Chapter 3: Static Testing", "chapterNum": 3}, {"id": "B18", "text": "Given the following roles in reviews:\n1. Scribe\n2. Review leader\n3. Facilitator\n4. Manager\n\nAnd the following responsibilities in reviews:\nA. Ensures the effective running of review meetings and the setting up a safe review environment\nB. Records review information, such as decisions and new anomalies found during the review meeting\nC. Decides what is to be reviewed and provides resources, such as staff and time for the review\nD. Takes overall responsibility for the review such as organizing when and where the review will take place\n\nWhich of the following BEST matches the roles and responsibilities?", "options": ["1A, 2B, 3D, 4C", "1A, 2C, 3B, 4D", "1B, 2D, 3A, 4C", "1B, 2D, 3C, 4A"], "correct": [2], "context": "Considering each of the listed roles: Scribe (or Recorder) - responsible for gathering feedback from reviewers and documenting review information, such as decisions made, and any new anomalies identified during the review meeting. (Records review information, such as decisions and new anomalies found during the review meeting - B) Review Leader - responsible for overseeing the review process, such as selecting the review team members, scheduling review meetings, and ensuring that the review is completed successfully. (Takes overall responsibility for the review such as organizing when and where the review will take place - D) Facilitator (or Moderator) - responsible for ensuring that the review meetings run effectively, including managing time, mediating discussions, and creating a safe environment where everyone can voice their opinions freely. (Ensures the effective running of review meetings and the setting up of a safe review environment - A) Manager - responsible for deciding what needs to be reviewed and allocating resources, such as staff and time, for the review. (Decides what is to be reviewed and provides resources, such as staff and time for the review - C)", "perOption": ["Is not correct.", "Is not correct.", "Is correct. The correct match is: 1B, 2D, 3A, 4C.", "Is not correct."], "chapter": "Chapter 3: Static Testing", "chapterNum": 3}, {"id": "B19", "text": "Which of the following statements BEST describes the difference between decision table testing and branch testing?", "options": ["In decision table testing, the test cases are derived from the decision statements in the code. In branch testing, the test cases are derived from knowledge of the control flow of the test object.", "In decision table testing, the test cases are derived from the specification that describes the business logic. In branch testing the test cases are based on anticipation of potential defects in the source code.", "In decision table testing, the test cases are derived from knowledge of the control flow of the test object. In branch testing, test cases are derived from the specification that describes the business logic.", "In decision table testing, the test cases are independent of how the software is implemented. In branch testing, test cases can be created only after the design or implementation of the code."], "correct": [3], "context": null, "perOption": ["Is not correct. Decision table testing is a black-box test technique, not a white-box test technique – the test cases are not based on the decisions in the source code. In branch testing, the test cases are derived from knowledge of the control flow of the test object", "Is not correct. Anticipation of potential defects is used in error guessing (an experience-based test technique), not in branch testing (a white-box test technique). In decision table testing, the test cases are derived from the specification that describes the business logic", "Is not correct. If a test case is based on the knowledge of the control flow of the test object, it is a white-box test technique. Decision table testing is typically based on an analysis of business logic, so it is a black-box test technique. In branch testing, test cases are not derived from the specification – this would make it a black-box test technique. Branch testing is a white-box test technique, where test cases are derived based on the source code structure", "Is correct. Decision table testing is a black-box test technique, so it is based on an analysis of the specified behavior of the test object without reference to its internal structure. Therefore, the test cases are independent of how the software is implemented. Branch testing is a white-box test technique, so test cases are based on an analysis of the test object’s internal structure and processing. As the test cases are dependent on how the software is designed and coded, they can only be created after the design or implementation of the test object"], "chapter": "Chapter 4: Test Analysis and Design", "chapterNum": 4}, {"id": "B20", "text": "Customers of the TestWash car wash chain have cards with a record of the number of washes they have bought so far. The initial value is 0. After entering the car wash, the system increases the number on the card by one. This value represents the number of the current wash. Based on this number the system decides what discount the customer is entitled to. For every tenth wash the system gives a 10% discount, and for every twentieth wash, the system gives a further 40% discount (i.e., a 50% discount in total). Which of the following sets of input data (understood as the numbers of the current wash) achieves the highest equivalence partition coverage?", "options": ["19, 20, 30", "11, 12, 20", "1, 10, 50", "10, 29, 30, 31"], "correct": [0], "context": null, "perOption": ["Is correct. 19 covers the “no discount” partition, 20 covers the “50% discount” partition, and 30 covers the “10% discount” partition. These three values cover all three of the valid equivalence partitions", "Is not correct. 11 and 12 cover the “no discount” partition, while 20 covers the “50% discount” partition, so covering two of the three valid equivalence partitions", "Is not correct. 1 covers the “no discount” partition, while 10 and 50 cover the “10% discount” partition. The “50% discount” partition is not covered, so overall two of the three valid equivalence partitions are covered", "Is not correct. 29 and 31 cover the “no discount” partition, while 10 and 30 cover the “10% discount” partition. The “50% discount” partition is not covered, so overall two of the three valid equivalence partitions are covered"], "chapter": "Chapter 4: Test Analysis and Design", "chapterNum": 4}, {"id": "B21", "text": "You are testing a form that verifies the correctness of the length of the password given as input. The form accepts a password with the correct length and rejects a password that is too short or too long. The password length is correct if it has between 6 and 12 characters inclusive. Otherwise, it is considered incorrect. At first, the form is empty (password length = 0). You apply boundary value analysis to the \"password length\" variable. Your set of test cases achieves 100% 2-value boundary value coverage. The team decided that due to the high risk of this component, test cases should be added to ensure 100% 3-value boundary value coverage. Which additional password lengths should be tested to achieve this?", "options": ["4, 5, 13, 14", "7, 11", "1, 5, 13", "1, 4, 7, 11, 14"], "correct": [3], "context": "The domain for the password length has three equivalence partitions: passwords too short {0, 1, …, 4, 5} passwords OK {6, 7, …, 11, 12} passwords too long {13, 14, …} To achieve full coverage for 3-value BVA we need to test the following values: 0, 1, 4, 5, 6, 7, 11, 12, 13, 14. Since 2-value BVA is already covered, this means that we have already tested the passwords of length: 0, 5, 6, 12 and 13. This means that the additional lengths that need to be covered to move from 2-value to 3-value are: 1, 4, 7, 11 and 14.", "perOption": ["Is not correct.", "Is not correct.", "Is not correct.", "Is correct."], "chapter": "Chapter 4: Test Analysis and Design", "chapterNum": 4}, {"id": "B22", "text": "The following decision table contains the rules for determining the risk of atherosclerosis.\n\nRule 1: Cholesterol ≤124 mg/dl, Blood pressure ≤140 mm Hg → Risk level: very low\nRule 2: Cholesterol ≤124 mg/dl, Blood pressure >140 mm Hg → Risk level: low\nRule 3: Cholesterol 125–200 mg/dl, Blood pressure ≤140 mm Hg → Risk level: medium\nRule 4: Cholesterol 125–200 mg/dl, Blood pressure >140 mm Hg → Risk level: high\nRule 5: Cholesterol ≥201 mg/dl, Blood pressure: – (irrelevant) → Risk level: very high\n\nYou designed the test cases with the following input data:\nTC1: Cholesterol = 125 mg/dl, Blood pressure = 141 mm Hg\nTC2: Cholesterol = 200 mg/dl, Blood pressure = 201 mm Hg\nTC3: Cholesterol = 124 mg/dl, Blood pressure = 201 mm Hg\nTC4: Cholesterol = 109 mg/dl, Blood pressure = 200 mm Hg\nTC5: Cholesterol = 201 mg/dl, Blood pressure = 140 mm Hg\n\nWhat is the decision table coverage achieved by these test cases?", "options": ["40%", "60%", "80%", "100%"], "correct": [1], "context": "There are five columns in the decision table. Each test case covers one of them. TC1 and TC2 both cover Rule 4 TC3 and TC4 both cover Rule 2 TC5 covers Rule 5 So, these five test cases cover three out of five columns, achieving a coverage of (3/5)*100% = 60%. Therefore, option b) is the CORRECT option.", "perOption": ["Is not correct.", "Is correct.", "Is not correct.", "Is not correct."], "chapter": "Chapter 4: Test Analysis and Design", "chapterNum": 4}, {"id": "B23", "text": "A storage system can store up to three elements and is modeled by the following state transition diagram. The variable N represents the number of currently stored elements. \n\nWhich of the following test cases, represented as sequences of events, achieves the highest level of valid transitions coverage?", "options": ["Add, Remove, Add, Add, Add", "Add, Add, Add, Add, Remove, Remove", "Add, Add, Add, Remove, Remove", "Add, Add, Add, Remove, Add"], "correct": [2], "context": "Let us refer to the transitions with E1, …, E5 as in the picture. The variable N denotes the number of elements currently stored. Each “Add” event increases it by 1, and each “Remove” event decreases it by 1. Notice, that when the “Add” event occurs while being in the NOT FULL state, the state changes to FULL only if N=2. If N<2, the system stays in the NOT FULL state. If N=0, no “Remove” action is possible. Similarly, if N=3, no “Add” action is possible. Test a) can be written as E1, E3, E3, E2, E4 (so covers 4 out of 5 valid transitions, achieving 80% valid transitions coverage). Test b) is infeasible, because after the first three “Add” actions the system is in the FULL state and there is no valid transition going from FULL triggered by the “Add” event. After the first three transitions only 60% of valid transitions coverage is achieved. Test c) can be written as E1, E2, E4, E5, E3 (so covers 5 out of 5 valid transitions, achieving 100% valid transitions coverage). Test d) can be written as E1, E2, E4, E5, E4 (so covers 4 out of 5 valid transitions, achieving 80% valid transitions coverage).", "perOption": ["Is not correct.", "Is not correct.", "Is correct.", "Is not correct."], "chapter": "Chapter 4: Test Analysis and Design", "chapterNum": 4, "image":
