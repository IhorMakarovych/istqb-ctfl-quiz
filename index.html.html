<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CTFL v4.0 :: exam practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F5F6F8;
    --panel: #FFFFFF;
    --panel-2: #F1F3F6;
    --line: #E1E5EB;
    --text: #1B2430;
    --muted: #6B7684;
    --pass: #1F9254;
    --pass-bg: #E6F6ED;
    --fail: #D64545;
    --fail-bg: #FCEAEA;
    --run: #2563EB;
    --pending: #FFFFFF;
    --ch1: #4F46E5; --ch1-bg: #EEEDFC;
    --ch2: #2563EB; --ch2-bg: #EAF0FE;
    --ch3: #0D9488; --ch3-bg: #E3F5F3;
    --ch4: #EA580C; --ch4-bg: #FDECE1;
    --ch5: #DB2777; --ch5-bg: #FCE7F1;
    --ch6: #CA8A04; --ch6-bg: #FBF3DD;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 80% -10%, #EEF2FF 0%, transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:40px 16px;
  }
  .app{
    width:100%;
    max-width:720px;
  }
  .examtabs{
    display:flex;
    gap:8px;
    margin-bottom:16px;
  }
  .exam-tab{
    flex:1;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--muted);
    padding:10px 14px;
    border-radius:8px;
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    transition:border-color .15s ease, color .15s ease, background .15s ease;
  }
  .exam-tab:hover{ border-color:var(--run); color:var(--run); }
  .exam-tab.active{ background:var(--run); border-color:var(--run); color:#fff; }

  .console-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:18px;
    font-family:'IBM Plex Mono', monospace;
  }
  .console-head .id{
    color:var(--run);
    font-size:13px;
    letter-spacing:0.06em;
  }
  .console-head h1{
    font-size:15px;
    margin:0;
    color:var(--muted);
    font-weight:500;
  }
  .navbar{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:16px;
  }
  .timerbar{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:16px;
    font-family:'IBM Plex Mono', monospace;
  }
  #timerDisplay{
    font-size:20px;
    font-weight:600;
    color:var(--text);
    min-width:64px;
  }
  .timer-btn{
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--text);
    padding:7px 16px;
    border-radius:7px;
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    transition:border-color .15s ease, color .15s ease, background .15s ease;
  }
  .timer-btn:hover{ border-color:var(--run); color:var(--run); }
  .timer-btn.active{ background:var(--run); border-color:var(--run); color:#fff; }
  .arrow-btn{
    flex-shrink:0;
    width:34px;
    height:34px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--text);
    font-size:16px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:border-color .15s ease, background .15s ease;
  }
  .arrow-btn:hover:not(:disabled){ border-color:var(--run); color:var(--run); }
  .arrow-btn:disabled{ opacity:0.35; cursor:default; }

  .pipeline{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(30px, 1fr));
    gap:6px;
    flex:1;
  }
  .stage{
    height:30px;
    border-radius:6px;
    border:1px solid var(--line);
    background:var(--pending);
    color:var(--muted);
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    font-weight:600;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:border-color .15s ease, background .15s ease, color .15s ease, transform .1s ease;
    padding:0;
  }
  .stage:hover{ border-color:var(--run); color:var(--run); }
  .stage.active{ border-color:var(--run); border-width:2px; color:var(--run); }
  .stage.pass{ background:var(--pass); border-color:var(--pass); color:#fff; }
  .stage.fail{ background:var(--fail); border-color:var(--fail); color:#fff; }

  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:28px 26px;
  }
  .chapter-tag{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    font-weight:600;
    letter-spacing:0.04em;
    color:var(--ch-color);
    background:var(--ch-bg);
    border:1px solid var(--ch-color);
    border-radius:5px;
    padding:4px 10px;
    margin-bottom:12px;
  }
  .tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--muted);
    letter-spacing:0.08em;
    display:flex;
    justify-content:space-between;
    margin-bottom:14px;
  }
  .qtext{
    font-size:18px;
    line-height:1.5;
    margin:0 0 22px 0;
    font-weight:500;
    white-space:pre-line;
  }
  .qimage{
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:8px;
    padding:14px;
    margin-bottom:18px;
    text-align:center;
  }
  .qimage img{
    max-width:100%;
    height:auto;
    display:inline-block;
  }
  .lock-hint{
    background:var(--panel-2);
    border:1px dashed var(--line);
    border-radius:8px;
    padding:12px 16px;
    font-size:14px;
    color:var(--muted);
    margin-bottom:18px;
    text-align:center;
  }
  .lock-hint strong{ color:var(--run); }
  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .opt{
    text-align:left;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    padding:13px 16px;
    border-radius:8px;
    font-size:15px;
    font-family:'IBM Plex Sans', sans-serif;
    cursor:pointer;
    display:flex;
    gap:10px;
    align-items:flex-start;
    transition:border-color .15s ease, background .15s ease;
  }
  .opt:hover:not(:disabled){ border-color:var(--run); }
  .opt .k{
    font-family:'IBM Plex Mono', monospace;
    color:var(--muted);
    font-size:13px;
    flex-shrink:0;
  }
  .opt.correct{ border-color:var(--pass); background:var(--pass-bg); }
  .opt.wrong{ border-color:var(--fail); background:var(--fail-bg); }
  .opt.selected{ border-color:var(--run); }
  .opt:disabled{ cursor:default; opacity:0.9; }
  .submit-btn{
    background:var(--panel-2);
    border:1px solid var(--run);
    color:var(--run);
    padding:9px 18px;
    border-radius:7px;
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    margin-top:14px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease;
  }
  .submit-btn.show{ opacity:1; pointer-events:auto; }
  .submit-btn:hover{ background:#EAF0FE; }

  .footer-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:22px;
  }
  .verdict{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    color:var(--muted);
    min-height:18px;
  }
  .verdict.pass{ color:var(--pass); }
  .verdict.fail{ color:var(--fail); }
  .next-btn{
    background:var(--run);
    color:#fff;
    border:none;
    padding:10px 20px;
    border-radius:7px;
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease;
  }
  .next-btn.show{ opacity:1; pointer-events:auto; }
  .next-btn:hover{ filter:brightness(1.1); }

  .report{
    text-align:center;
    padding:10px 0 4px;
  }
  .report .rate{
    font-family:'IBM Plex Mono', monospace;
    font-size:52px;
    font-weight:700;
    margin:6px 0;
  }
  .report .rate.pass{ color:var(--pass); }
  .report .rate.warn{ color:var(--run); }
  .report .rate.fail{ color:var(--fail); }
  .report .label{
    font-family:'IBM Plex Mono', monospace;
    color:var(--muted);
    font-size:13px;
    letter-spacing:0.08em;
  }
  .report .breakdown{
    margin-top:22px;
    display:flex;
    justify-content:center;
    gap:26px;
    font-family:'IBM Plex Mono', monospace;
    font-size:14px;
  }
  .report .breakdown span.n{ font-size:20px; font-weight:700; display:block; }
  .restart-btn{
    margin-top:26px;
    background:transparent;
    border:1px solid var(--line);
    color:var(--text);
    padding:10px 20px;
    border-radius:7px;
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    cursor:pointer;
  }
  .restart-btn:hover{ border-color:var(--run); }

  .explain{
    margin-top:18px;
    padding:16px 18px;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-left:3px solid var(--run);
    border-radius:0 8px 8px 0;
    font-size:14px;
    line-height:1.6;
    color:var(--text);
    display:none;
  }
  .explain.show{ display:block; }
  .explain .explain-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.08em;
    color:var(--run);
    margin-bottom:8px;
    display:block;
  }
  .explain p{ margin:0 0 10px 0; }
  .explain p:last-child{ margin-bottom:0; }

  @media (max-width: 600px){
    body{ padding:16px 10px; }
    .examtabs{ gap:6px; margin-bottom:12px; }
    .exam-tab{ padding:8px 10px; font-size:12px; }
    .console-head{ margin-bottom:14px; }
    .console-head .id{ font-size:11px; }
    .console-head h1{ font-size:13px; }
    .timerbar{ margin-bottom:12px; }
    #timerDisplay{ font-size:17px; min-width:54px; }
    .timer-btn{ padding:6px 12px; font-size:12px; }
    .navbar{ gap:6px; margin-bottom:12px; }
    .arrow-btn{ width:30px; height:30px; font-size:14px; }
    .pipeline{ grid-template-columns:repeat(auto-fill, minmax(24px, 1fr)); gap:4px; }
    .stage{ height:26px; font-size:10px; border-radius:5px; }
    .panel{ padding:18px 14px; border-radius:8px; }
    .chapter-tag{ font-size:10px; padding:3px 8px; margin-bottom:10px; }
    .tag{ font-size:11px; margin-bottom:10px; }
    .qtext{ font-size:16px; margin-bottom:16px; }
    .lock-hint{ font-size:13px; padding:10px 12px; }
    .opt{ padding:11px 12px; font-size:14px; gap:8px; }
    .opt .k{ font-size:12px; }
    .submit-btn{ width:100%; padding:10px 14px; }
    .footer-row{ flex-wrap:wrap; gap:10px; margin-top:16px; }
    .next-btn{ padding:9px 16px; font-size:12px; }
    .explain{ padding:12px 14px; font-size:13px; }
    .report .rate{ font-size:38px; }
    .report .breakdown{ gap:14px; flex-wrap:wrap; }
    .report .breakdown span.n{ font-size:17px; }
    .restart-btn{ width:100%; padding:11px 14px; }
  }

  @media (max-width: 360px){
    .pipeline{ grid-template-columns:repeat(auto-fill, minmax(20px, 1fr)); }
    .stage{ height:22px; font-size:9px; }
  }
</style>
</head>
<body>
  <div class="app">
    <div class="examtabs">
      <button class="exam-tab active" id="tabA">Exam A</button>
      <button class="exam-tab" id="tabB">Exam B</button>
      <button class="exam-tab" id="tabC">Exam C</button>
      <button class="exam-tab" id="tabD">Exam D</button>
    </div>
    <div class="console-head">
      <span class="id" id="examLabel">CTFL v4.0 // sample Exam A</span>
      <h1 id="progressLabel">0 / 0</h1>
    </div>
    <div class="timerbar">
      <span id="timerDisplay">00:00</span>
      <button class="timer-btn" id="startBtn">Start</button>
      <button class="timer-btn" id="stopBtn">Stop</button>
    </div>
    <div class="navbar">
      <button class="arrow-btn" id="prevBtn" title="Previous question">&#8592;</button>
      <div class="pipeline" id="pipeline"></div>
      <button class="arrow-btn" id="nextArrowBtn" title="Next question">&#8594;</button>
    </div>
    <div class="panel" id="panel"></div>
  </div>

<script>
const DATA_A = [{"id": "Q1", "text": "Which of the following statements describe a valid test objective?", "options": ["To prove that there are no unfixed defects in the system under test", "To prove that there will be no failures after the implementation of the system into production", "To reduce the risk level of the test object and to build confidence in the quality level", "To verify that there are no untested combinations of inputs"], "correct": [2], "context": null, "perOption": ["Is not correct. It is impossible to prove that there are no defects anymore in the system under test. See testing principle 1", "Is not correct. See testing principle 7", "Is correct. Testing finds defects and failures which reduces the level of risk and at the same time gives more confidence in the quality level of the test object", "Is not correct. It is impossible to test all combinations of inputs (see testing principle 2)"], "chapter": "Chapter 1: Fundamentals of Testing", "chapterNum": 1}, {"id": "Q2", "text": "Which of the following options shows an example of test activities that contribute to success?", "options": ["Having testers involved during various software development lifecycle (SDLC) activities will help to detect defects in work products", "Testers try not to disturb the developers while coding, so that the developers write better code", "Testers collaborating with end users help to improve the quality of defect reports during component integration and system testing", "Certified testers will design much better test cases than non-certified testers"], "correct": [0], "context": null, "perOption": ["Is correct. It is important that testers are involved from the beginning of the software development lifecycle (SDLC). It will increase understanding of design decisions and will detect defects early.", "Is not correct. Both developers and testers will have more understanding of each other's work products and how to test the code", "Is not correct. End users will not help the testers in increasing the quality of defect reports; also, users usually do not participate in low-level testing levels like integration testing", "Is not correct. Being certified does not automatically mean that the tester will be better in test design"], "chapter": "Chapter 1: Fundamentals of Testing", "chapterNum": 1}, {"id": "Q3", "text": "You have been assigned as a tester to a team producing a new system incrementally. You have noticed that no changes have been made to the existing regression test cases for several iterations and no new regression defects were identified. Your manager is happy, but you are not. Which testing principle explains your skepticism?", "options": ["Tests wear out", "Absence-of-defects fallacy", "Defects cluster together", "Exhaustive testing is impossible"], "correct": [0], "context": null, "perOption": ["Is correct. This principle means that if the same tests are repeated over and over again, eventually these tests no longer find any new defects. This is probably why the tests all passed in this release as well", "Is not correct. This principle says about the mistaken belief that just finding and fixing a large number of defects will ensure the success of a system", "Is not correct. This principle says that a small number of components usually contain most of the defects", "Is not correct. This principle states that testing all combinations of inputs and preconditions is not feasible"], "chapter": "Chapter 1: Fundamentals of Testing", "chapterNum": 1}, {"id": "Q4", "text": "You work in a team that develops a mobile application for food ordering. In the current iteration the team decided to implement the payment functionality. Which of the following activities is a part of test analysis?", "options": ["Estimating that testing the integration with the payment service will take 8 person-days", "Deciding that the team should test if it is possible to properly share payment between many users", "Using boundary value analysis (BVA) to derive the test data for the test cases that check the correct payment processing for the minimum allowed amount to be paid", "Analyzing the discrepancy between the actual result and expected result after executing a test case that checks the process of payment with a credit card, and reporting a defect"], "correct": [1], "context": null, "perOption": ["Is not correct. Estimating the test effort is part of test planning", "Is correct. This is an example of defining test conditions which is a part of test analysis", "Is not correct. Using test techniques to derive coverage items is a part of test design", "Is not correct. Reporting defects found during dynamic testing is a part of test execution"], "chapter": "Chapter 1: Fundamentals of Testing", "chapterNum": 1}, {"id": "Q6", "text": "Which TWO of the following tasks belong MAINLY to a testing role?", "options": ["Configure test environments", "Maintain the product backlog", "Design solutions to new requirements", "Create the test plan", "Analyze the test basis"], "correct": [0, 4], "context": null, "perOption": ["Is correct. This is done by the testers", "Is not correct. The product backlog is built and maintained by the product owner", "Is not correct. This is done by the development team", "Is not correct. This is a managerial role", "Is correct. This is done by the testers since its technical task done as part of a test analysis."], "chapter": "Chapter 1: Fundamentals of Testing", "chapterNum": 1}, {"id": "Q7", "text": "Which of the following skills (i-v) are the MOST important skills of a tester?\ni. Having domain knowledge\nii. Creating a product vision\niii. Being a good team player\niv. Planning and organizing the work of the team\nv. Critical thinking", "options": ["ii and iv are important", "i, iii and v are important", "i, ii and v are important", "iii and iv are important"], "correct": [1], "context": "Is true. Having domain knowledge is an important tester skill Is false. This is a task of the business analyst together with the business representative Is true. Being a good team player is an important skill Is false. Planning and organizing the work of the team is a task of the test manager or, mostly in an Agile software development project, the whole team and not just the tester Is true. Critical thinking is one of the most important skills of testers", "perOption": ["Is not correct.", "Is correct.", "Is not correct.", "Is not correct."], "chapter": "Chapter 1: Fundamentals of Testing", "chapterNum": 1}, {"id": "Q8", "text": "How is the whole team approach present in the interactions between testers and business representatives?", "options": ["Business representatives decide on test automation approaches", "Testers help business representatives to define a test strategy", "Business representatives are not part of the whole team approach", "Testers help business representatives to create suitable acceptance tests"], "correct": [3], "context": null, "perOption": ["Is not correct. The test automation approach is defined by testers with the help of developers and business representatives", "Is not correct. The test strategy is decided in collaboration with the developers", "Is not correct. Testers, developers, and business representatives are part of the whole team approach", "Is correct. Testers will work closely with business representatives to ensure that the desired quality levels are achieved. This includes supporting and collaborating with them to help them create suitable acceptance tests"], "chapter": "Chapter 1: Fundamentals of Testing", "chapterNum": 1}, {"id": "A1", "text": "You were given a task to analyze and fix causes of failures in a new system to be released. Which activity are you performing?", "options": ["Debugging", "Software testing", "Requirement elicitation", "Defect management"], "correct": [0], "context": null, "perOption": ["Is correct. Debugging is the process of finding, analyzing, and removing the causes of failures in a component or system", "Is not correct. Testing is the process concerned with planning, preparation and evaluation of a component or system and related work products to determine that they satisfy specified requirements, to demonstrate that they are fit for purpose and to detect defects. It is not related to fixing causes of failures", "Is not correct. Requirement elicitation is the process of gathering, capturing, and consolidating requirements from available sources. It is not related to fixing causes of failures", "Is not correct. Defect management is the process of recognizing, recording, classifying, investigating, resolving, and disposing of defects. It is not related to fixing causes of failures"], "chapter": "Chapter 1: Fundamentals of Testing", "chapterNum": 1}, {"id": "A2", "text": "In many software organizations the test department is called the Quality Assurance (QA) department. Is this sentence correct or not and why?", "options": ["It is correct. Testing and QA mean exactly the same thing", "It is correct. These names can be used interchangeably because both testing and QA focus their activities on the same quality issues", "It is not correct. Testing is something more; testing includes all activities with regard to quality. QA focuses on quality-related processes", "It is not correct. QA is focused on quality-related processes while testing concentrates on demonstrating that a component or system is fit for purpose and to detect defects"], "correct": [3], "context": "Considering: Testing and quality assurance are not the same. Testing is the process consisting of all software development lifecycle (SDLC) activities, both static and dynamic, concerned with planning, preparation and evaluation of a component or system and related work products to determine that they satisfy specified requirements, to demonstrate that they are fit for purpose and to detect defects. Quality assurance is focused on establishing, introducing, monitoring, improving, and adhering to the quality-related processes.", "perOption": ["Is not correct.", "Is not correct.", "Is not correct.", "Is correct."], "chapter": "Chapter 1: Fundamentals of Testing", "chapterNum": 1}, {"id": "A3", "text": "A phone ringing in a neighboring cubicle distracts a programmer causing him to improperly program the logic that checks the upper boundary of an input variable. Later, during system testing, a tester notices that this input field accepts invalid input values. Which of the following correctly describes an incorrectly coded upper bound?", "options": ["The root cause", "A failure", "An error", "A defect"], "correct": [3], "context": null, "perOption": ["Is not correct. The root cause is the distraction that the programmer experienced while programming", "Is not correct. Accepting invalid inputs is a failure", "Is not correct. The error in thinking that put the defect in the code", "Is correct. The problem in the code is a defect"], "chapter": "Chapter 1: Fundamentals of Testing", "chapterNum": 1}, {"id": "A5", "text": "Which of the following is the BEST example of how traceability supports testing?", "options": ["Performing the impact analysis of a change will give information about the completion of the tests", "Analyzing the traceability between test cases and test results will give information about the estimated level of residual risk", "Performing the impact analysis of a change will help selecting the right test cases for regression testing", "Analyzing the traceability between the test basis, the test objects and the test cases will help in selecting test data to achieve the assumed coverage of the test object"], "correct": [2], "context": null, "perOption": ["Is not correct. Performing the impact analysis will not give information about completeness of tests. Analyzing the impact analysis of changes will help to select the right test cases for execution", "Is not correct. Traceability does not give information about the estimated level of residual risk if the test cases are not traced back to risks", "Is correct. Performing the impact analysis of the changes helps in selecting the test cases for the regression test", "Is not correct. Analyzing the traceability between the test basis, test objects and test cases does not help in selecting test data to achieve the assumed coverage of the test object. Selecting test data is more related to test analysis and test implementation, not traceability"], "chapter": "Chapter 1: Fundamentals of Testing", "chapterNum": 1}, {"id": "A6", "text": "Which of the following BEST explains a benefit of independence of testing?", "options": ["The use of an independent test team allows project management to assign responsibility for the quality of the final deliverable to the test team", "If a test team external to the organization can be afforded, then there are distinct benefits in terms of this external team not being so easily swayed by the delivery concerns of project management and the need to meet strict delivery deadlines", "An independent test team can work separately from the developers, need not be distracted with project requirement changes, and can restrict communication with the developers to defect reporting through the defect management system", "When specifications contain ambiguities and inconsistencies, assumptions are made on their interpretation, and an independent tester can be useful in questioning those assumptions and the interpretation made by the developer"], "correct": [3], "context": null, "perOption": ["Is not correct. Quality should be the responsibility of everyone working on the project and not the sole responsibility of the test team", "Is not correct. First, it is not a benefit if an external test team does not meet delivery deadlines, and second, there is no reason to believe that external test teams will feel they do not have to meet strict delivery deadlines", "Is not correct. It is bad practice for the test team to work in complete isolation, and we would expect an external test team to be concerned with changing project requirements and communicating well with developers", "Is correct. Specifications are never perfect, meaning that assumptions will have to be made by the developer. An independent tester is useful in that they can challenge and verify the assumptions and subsequent interpretation made by the developer"], "chapter": "Chapter 1: Fundamentals of Testing", "chapterNum": 1}, {"id": "Q5", "text": "Which of the following factors have a SIGNIFICANT influence on the test approach?\ni. The SDLC\nii. The number of defects detected in previous projects\niii. The identified product risks\niv. New regulatory requirements forcing formal white-box testing\nv. The test environment setup", "options": ["i, ii have significant influence", "i, iii, iv have significant influence", "ii, iv, v have significant influence", "iii, v have significant influence"], "correct": [1], "context": "Is true. The SDLC has an influence on the test approach Is false. The number of defects detected in previous projects may have some influence, but this is not as significant as i, iii and iv Is true. The identified product risks are one of the most important factors influencing the test approach Is true. Regulatory requirements are important factors influencing the test approach Is false. The test environment has no significant influence on the test approach", "perOption": ["Is not correct.", "Is correct.", "Is not correct.", "Is not correct."], "chapter": "Chapter 2: Testing Throughout the SDLC", "chapterNum": 2}, {"id": "Q9", "text": "Consider the following rule: \"for every SDLC activity there is a corresponding test activity\". In which SDLC models does this rule hold?", "options": ["Only in sequential development models", "Only in iterative development models", "Only in iterative and incremental development models", "In sequential, incremental, and iterative development models"], "correct": [3], "context": null, "perOption": ["Is not correct", "Is not correct", "Is not correct", "Is correct. This rule holds for all SDLC models"], "chapter": "Chapter 2: Testing Throughout the SDLC", "chapterNum": 2}, {"id": "Q10", "text": "Which of the following statements BEST describes the acceptance test-driven development (ATDD) approach?", "options": ["In ATDD, acceptance criteria are typically created based on the given/when/then format", "In ATDD, test cases are mainly created at component testing and are code-oriented", "In ATDD, tests are created, based on acceptance criteria to drive the development of the related software", "in ATDD, tests are based on the desired behavior of the software, which makes it easier for team members to understand them"], "correct": [2], "context": null, "perOption": ["Is not correct. It is more often used in behavior-driven development (BDD)", "Is not correct. It is the description of test-driven development (TDD)", "Is correct. In acceptance test-driven development (ATDD) tests are written from acceptance criteria as part of the design process", "Is not correct. It is used in BDD"], "chapter": "Chapter 2: Testing Throughout the SDLC", "chapterNum": 2}, {"id": "Q11", "text": "Which of the following is NOT an example of the shift-left approach?", "options": ["Reviewing the user requirements before they are formally accepted by the stakeholders", "Writing a component test before the corresponding code is written", "Executing a performance efficiency test for a component during component testing", "Writing a test script before setting up the configuration management process"], "correct": [3], "context": null, "perOption": ["Is not correct. Early review is an example of the shift-left approach", "Is not correct. TDD is an example of the shift-left approach", "Is not correct. Early non-functional testing is an example of the shift-left approach", "Is correct. Test scripts should be subject to configuration management, so it makes no sense to create the test scripts before this process is set up"], "chapter": "Chapter 2: Testing Throughout the SDLC", "chapterNum": 2}, {"id": "Q12", "text": "Which of the arguments below would you use to convince your manager to organize retrospectives at the end of each release cycle?", "options": ["Retrospectives are very popular these days and clients would appreciate it if we added them to our processes", "Organizing retrospectives will save the organization money because without them end user representatives do not provide immediate feedback about the product", "Process weaknesses identified during the retrospective can be analyzed and serve as a to do list for the organization's continuous process improvement program", "Retrospectives embrace five values including courage and respect, which are crucial to maintain continuous improvement in the organization"], "correct": [2], "context": null, "perOption": ["Is not correct. Retrospectives are more useful for identifying improvement opportunities and have little importance for clients", "Is not correct. Retrospectives are not aimed to collect feedback about the product, but about the process. Additionally, retrospectives are internal activity for the team and should not include end user representatives", "Is correct. Regularly conducted retrospectives, when appropriate follow up activities occur, are critical to continual improvement of development and testing", "Is not correct. Courage and respect are values of Extreme Programming and are not closely related to retrospectives"], "chapter": "Chapter 2: Testing Throughout the SDLC", "chapterNum": 2}, {"id": "Q13", "text": "Which types of failures (1-4) fit which test levels (A-D) BEST? 1. Failures in system behavior as it deviates from the user's business needs 2. Failures in communication between components 3. Failures in logic in the code 4. Failures in not correctly implemented business rules A. Component testing B. Component integration testing C. System testing D. Acceptance testing", "options": ["1D, 2B, 3A, 4C", "1D, 2B, 3C, 4A", "1B, 2A, 3D, 4C", "1C, 2B, 3A, 4D"], "correct": [0], "context": "Considering: The test basis for acceptance testing is the user’s business needs (1D) Communication between components is tested during component integration testing (2B) Failures in logic can be found during component testing (3A) Business rules are the test basis for system testing (4C)", "perOption": ["Is correct.", "Is not correct.", "Is not correct.", "Is not correct."], "chapter": "Chapter 2: Testing Throughout the SDLC", "chapterNum": 2}, {"id": "Q14", "text": "You are testing a user story with three acceptance criteria: AC1, AC2 and AC3. AC1 is covered by test case TC1, AC2 by TC2, and AC3 by TC3. The test execution history had three test runs on three consecutive versions of the software as follows:\n\nExecution 1: TC1 (1) Failed, TC2 (2) Passed, TC3 (3) Failed\nExecution 2: TC1 (4) Passed, TC2 (5) Failed, TC3 (6) Failed\nExecution 3: TC1 (7) Passed, TC2 (8) Passed, TC3 (9) Passed\n\nTests are repeated once you are informed that all defects found in the test run are corrected and a new version of the software is available. Which of the above tests are executed as regression tests?", "options": ["Only 4, 7, 8, 9", "Only 5, 7", "Only 4, 6, 8, 9", "Only 5, 6"], "correct": [1], "context": "Because TC1 and TC3 failed in Execution 1 (i.e., test (1) and test (3)), test (4) and test (6) are confirmation tests. Because TC2 and TC3 failed in Execution 2 (i.e., tests (5) and (6)), test (8) and test (9) are also confirmation tests. TC2 passed in Execution 1 (i.e., test (2)), so test (5) is a regression test. TC1 passed in the Execution 2 (i.e., test (4)), so test (7) is also a regression test.", "perOption": ["Is not correct.", "Is correct.", "Is not correct.", "Is not correct."], "chapter": "Chapter 2: Testing Throughout the SDLC", "chapterNum": 2}, {"id": "A7", "text": "You are working as a tester in the team that follows the V-model. Which of the following activities CAN be performed in the initial phases of the SDLC?", "options": ["Dynamic test execution", "Static testing", "Test planning", "Acceptance test execution", "Maintenance testing"], "correct": [1, 2], "context": null, "perOption": ["Is not correct. The executable code is usually created in the later phases, so dynamic test execution cannot be performed early in the SDLC", "Is correct. In sequential development models, in the initial phases, testers participate in requirement reviews, which is a form of static testing.", "Is correct. Test planning could be performed early in the SDLC before the test project begins together with test analysis and test design.", "Is not correct. Acceptance test execution can be performed when there is a working product. In sequential SDLC models the working product is usually delivered later in the SDLC", "Is not correct. Maintenance testing when there is a working and deployed product, which is not done in the early phases of any SDLC."], "chapter": "Chapter 2: Testing Throughout the SDLC", "chapterNum": 2}, {"id": "A8", "text": "Which of the following are advantages of DevOps?\ni. Faster product release and faster time to market\nii. Increases the need for repetitive manual testing\niii. Constant availability of executable software\niv. Reduction in the number of regression tests associated with code refactoring\nv. Setting up the test automation framework is inexpensive since everything is automated", "options": ["i, ii, iv are advantages", "iii, v are advantages", "i, iii are advantages", "ii, iv, v are advantages"], "correct": [2], "context": "Consider: Is true. Faster product release and faster time to market is an advantage of DevOps Is false. Typically, we need less effort for manual tests because of the use of test automation Is true. Constant availability of executable software is an advantage Is false. More regression tests are needed Is false. Not everything is automated and setting up a test automation framework is expensive", "perOption": ["Is not correct.", "Is not correct.", "It is correct.", "Is not correct."], "chapter": "Chapter 2: Testing Throughout the SDLC", "chapterNum": 2}, {"id": "A9", "text": "You work as a tester on a project on a mobile application for food ordering for one of your clients. The client sent you a list of requirements. One of them, with high priority, says *\"The order must be processed in less than 10 seconds in 95% of the cases\".* You created a set of test cases in which a number of random orders were made, the processing time measured, and the test results were checked against the requirements. What test type did you perform?", "options": ["Functional, because the test cases cover the user's business requirement for the system", "Non-functional, because they measure the system's performance", "Functional, because the test cases interact with the user interface", "White-box, because we need to know the internal structure of the program to measure the order processing time"], "correct": [1], "context": null, "perOption": ["Is not correct. The fact that the requirement about the system’s performance comes directly from the client and that the performance is important from the business point of view (i.e., high priority) does not make these tests functional, because they do not check “what” the system does, but “how” (i.e., how fast the orders are processed)", "Is correct. This is an example of testing for performance efficiency, a type of non-functional testing", "Is not correct. From the scenario, we do not know if interacting with the user interface is a part of the test conditions. But even if we did, the main test objective of these tests is to check the performance, not the usability", "Is not correct. We do not need to know the internal structure of the code to perform the performance efficiency testing. One can execute performance efficiency tests without structural knowledge"], "chapter": "Chapter 2: Testing Throughout the SDLC", "chapterNum": 2}, {"id": "A10", "text": "Your organization's test strategy suggests that once a system is going to be retired, data migration shall be tested. As part of what test type is this testing MOST likely to be performed?", "options": ["Maintenance testing", "Regression testing", "Reliability testing", "Integration testing"], "correct": [0], "context": null, "perOption": ["Is correct. When a system is retired, this can require testing of data migration, which is a form of maintenance testing", "Is not correct. Regression testing verifies whether a fix accidentally affected the behavior of other parts of the code, but now we are talking about data migration to a new system", "Is not correct. Portability testing focuses on transferring the system to another environment", "Is not correct. Integration testing focuses on interactions between components and/or systems, not on data migration. Also, it is not a test type, but a test level."], "chapter": "Chapter 2: Testing Throughout the SDLC", "chapterNum": 2}, {"id": "Q15", "text": "Which of the following is NOT a benefit of static testing?", "options": ["Having less expensive defect management due to the ease of detecting defects later in the SDLC", "Fixing defects found during static testing is generally much less expensive than fixing defects found during dynamic testing", "Finding coding defects that might not have been found by only performing dynamic testing", "Detecting gaps and inconsistencies in requirements"], "correct": [0], "context": null, "perOption": ["Is correct. Defect management is no less expensive. Finding and fixing defects later in the SDLC is more costly", "Is not correct. This is a benefit of static testing", "Is not correct. This is a benefit of static testing", "Is not correct. This is a benefit of static testing"], "chapter": "Chapter 3: Static Testing", "chapterNum": 3}, {"id": "Q16", "text": "Which of the following is a benefit of early and frequent feedback?", "options": ["It improves the test process for future projects", "It forces customers to prioritize their requirements based on agreed risks", "It provides a measure for the quality of changes", "It helps avoid requirements misunderstandings"], "correct": [3], "context": null, "perOption": ["Is not correct. Feedback can improve the test process, but if one only wants to improve future projects, the feedback does not need to come early or frequently", "Is not correct. Feedback is not used to prioritize requirements", "Is not correct. There is no one, recommended way to measure quality of changes. Also, this is not one of the benefits of early feedback that are mentioned in section 3.2.1", "Is correct. Early and frequent feedback can prevent misunderstandings about requirements"], "chapter": "Chapter 3: Static Testing", "chapterNum": 3}, {"id": "Q17", "text": "The reviews being used in your organization have the following attributes: - There is the role of a scribe - The main purpose is to evaluate quality - The meeting is led by the author of the work product - There is individual preparation - A review report is produced Which of the following review types is MOST likely being used?", "options": ["Informal review", "Walkthrough", "Technical review", "Inspection"], "correct": [1], "context": "Considering the attributes: Specified for walkthroughs, technical reviews, and inspections; thus, the reviews being performed cannot be informal reviews The purpose of evaluating quality is one of the most important objectives of a walkthrough This is not allowed for inspections and is typically not done in technical reviews. A moderator is needed in walkthroughs and is allowed for informal reviews All types of reviews can include individual preparation (even informal reviews) All types of reviews can produce a review report, although informal reviews do not require documentation", "perOption": ["Is not correct.", "Is correct.", "Is not correct.", "Is not correct."], "chapter": "Chapter 3: Static Testing", "chapterNum": 3}, {"id": "Q18", "text": "Which of these statements is NOT a factor that contributes to successful reviews?", "options": ["Participants should dedicate adequate time for the review", "Splitting large work products into small parts to make the required effort less intense", "Participants should avoid behaviors that might indicate boredom, exasperation, or hostility to other participants", "Failures found should be acknowledged, appreciated, and handled objectively"], "correct": [3], "context": null, "perOption": ["Is not correct. Adequate time for individuals is a success factor", "Is not correct. Splitting work products into small adequate parts is a success factor", "Is not correct. Avoiding behaviors that might indicate boredom, exasperation, etc. is a success factor", "Is correct. During reviews one can find defects, not failures"], "chapter": "Chapter 3: Static Testing", "chapterNum": 3}, {"id": "A11", "text": "The following is a list of the work products produced in the SDLC.\ni. Business requirements\nii. Schedule\niii. Test budget\niv. Third-party executable code\nv. User stories and their acceptance criteria\n\nWhich of them can be reviewed?", "options": ["i and iv can be reviewed", "i, ii, iii and iv can be reviewed", "i, ii, iii, and v can be reviewed", "iii, iv, v can be reviewed"], "correct": [2], "context": null, "perOption": ["Only third-party executable code cannot be reviewed. Thus:", "Is not correct", "Is not correct It is correct", "Is not correct"], "chapter": "Chapter 3: Static Testing", "chapterNum": 3}, {"id": "A12", "text": "Decide which of the following statements (i-v) are true for static testing.\ni. Abnormal external behaviors are easier to identify with this testing\nii. Discrepancies from a coding standard are easier to find with this testing\niii. It identifies failures caused by defects when the software is run\niv. Its test objective is to identify defects as early as possible\nv. Missing coverage for critical security requirements is easier to find and fix", "options": ["i, iv, v are true for static testing", "i, iii, iv are true for static testing", "ii, iii are true for static testing", "ii, iv, v are true for static testing"], "correct": [3], "context": "Consider: These behaviors are easily detectable while the software is running. Hence, dynamic testing shall be used to identify them This is an example of deviations from standards, which is a typical defect that is easier found with static testing If the software is executed during the test, it is dynamic testing Identifying defects as early as possible is the test objective of both static testing and dynamic testing This is an example of gaps in the test basis traceability or coverage, which is a typical defect that is easier found with static testing", "perOption": ["Is not correct.", "Is not correct.", "Is not correct.", "Is correct."], "chapter": "Chapter 3: Static Testing", "chapterNum": 3}, {"id": "A13", "text": "Which of the following statements about formal reviews is TRUE?", "options": ["Some reviews do not require more than one role", "The review process has several activities", "Documentation to be reviewed is not distributed before the review meeting, with the exception of the work product for specific review types", "Defects found during the review are not reported since they are not found by dynamic testing"], "correct": [1], "context": null, "perOption": ["Is not correct. In all types of reviews there is more than one role, even in informal ones", "Is correct. There are several activities during the formal review process", "Is not correct. Documentation to be reviewed should be distributed as early as possible", "Is not correct. Defects found during the review should be reported"], "chapter": "Chapter 3: Static Testing", "chapterNum": 3}, {"id": "A14", "text": "What task may management take on during a formal review?", "options": ["Taking overall responsibility for the review", "Deciding what is to be reviewed", "Ensuring the effective running of review meetings, and moderating, if necessary", "Recording review information such as review decisions"], "correct": [1], "context": null, "perOption": ["Is not correct. This is the task of the review leader", "Is correct. This is the task of the management in a formal review", "Is not correct. This is the task of the moderator", "Is not correct. This is the task of the scribe"], "chapter": "Chapter 3: Static Testing", "chapterNum": 3}, {"id": "Q19", "text": "Which of the following is a characteristic of experience-based test techniques?", "options": ["Test cases are created based on detailed design information", "Items tested within the interface code section are used to measure coverage", "The test techniques heavily rely on the tester's knowledge of the software and the business domain", "The test cases are used to identify deviations from the requirements"], "correct": [2], "context": null, "perOption": ["Is not correct. This is a common characteristic of white-box test techniques. Test conditions, test cases, and test data are derived from a test basis that may include code, software architecture, detailed design, or any other source of information regarding the structure of the software.", "Is not correct. This is a common characteristic of white-box test techniques. Coverage is measured based on the items tested within a selected structure and the test technique applied to the test basis", "Is correct. This is a common characteristic of experience-based test techniques. This knowledge and experience include expected use of the software, its environment, likely defects, and the distribution of those defects is used to define tests", "Is not correct. This is a common characteristic of black-box test techniques. Test cases may be used to detect gaps within requirements and the implementation of the requirements, as well as deviations from the requirements"], "chapter": "Chapter 4: Test Analysis and Design", "chapterNum": 4}, {"id": "Q20", "text": "You are testing a simplified apartment search form which has only two search criteria: - floor (with three possible options: ground floor; first floor; second or higher floor) - garden type (with three possible options: no garden; small garden; large garden) Each of the apartment on the ground floor has a garden, apartments on higher floors don't. The form has a built-in validation mechanism that will not allow you to use the search criteria which violate this rule. Each test has two input values: floor and garden type. You want to apply equivalence partitioning (EP) to cover each floor and each garden type in your tests. What is the **minimal** number of test cases to achieve 100% EP coverage for valid partitions?", "options": ["3", "4", "5", "6"], "correct": [1], "context": "The situation presented in the question is described in the syllabus as “each choice” coverage. “Small garden” and “large garden” can go only with “ground floor”, so we need two test cases with “ground floor” which cover these two “garden type” partitions. We need two more test cases to cover the two other “floor” partitions. The remaining ”garden type” partition of “no garden” is covered by these tests. We need a total of four test cases: TC1 (ground floor, small garden) TC2 (ground floor, large garden) TC3 (first floor, no garden) TC4 (second or higher floor, no garden)", "perOption": ["Is not correct.", "Is correct.", "Is not correct.", "Is not correct."], "chapter": "Chapter 4: Test Analysis and Design", "chapterNum": 4}, {"id": "Q21", "text": "You are testing a system that calculates the final course grade for a given student. The final grade is assigned based on the final result, according to the following rules:\n0 - 50 points: failed\n51 - 60 points: fair\n61 - 70 points: satisfactory\n71 - 80 points: good\n81 - 90 points: very good\n91 - 100 points: excellent\n\nYou have prepared the following set of test cases:\nTC1: Final result 91, Final grade excellent\nTC2: Final result 50, Final grade failed\nTC3: Final result 81, Final grade very good\nTC4: Final result 60, Final grade fair\nTC5: Final result 70, Final grade satisfactory\nTC6: Final result 80, Final grade good\n\nWhat is the 2-value boundary value analysis (BVA) coverage for the final result that is achieved with the existing test cases?", "options": ["50%", "60%", "33.3%", "100%"], "correct": [0], "context": "There are 12 boundary values for the final result values: 0, 50, 51, 60, 61, 70, 71, 80, 81, 90, 91, and 100. The test cases cover six of them (TC1 – 91, TC2 – 50, TC3 – 81, TC4 – 60, TC5 – 70 and TC7 – 51). Therefore, the test cases cover 6/12 = 50%.", "perOption": ["Is correct.", "Is not correct.", "Is not correct.", "Is not correct."], "chapter": "Chapter 4: Test Analysis and Design", "chapterNum": 4}, {"id": "Q22", "text": "Your favorite bicycle daily rental store has just introduced a new Customer Relationship Management system and asked you, one of their most loyal members, to test it. The implemented features are as follows:\nAnyone can rent a bicycle, but members receive a 20% discount\nHowever, if the return deadline is missed, the discount is no longer available\nAfter 15 rentals, members get a gift: a T-Shirt\n\nDecision table describing the implemented features looks as follows:\nR1: Being a member=T, Missed deadline=T, 15th rental=F -> (no discount, no gift)\nR2: Being a member=T, Missed deadline=F, 15th rental=F -> 20% discount\nR3: Being a member=T, Missed deadline=T, 15th rental=T -> Gift T-Shirt\nR4: Being a member=T, Missed deadline=F, 15th rental=T -> 20% discount + Gift T-Shirt\nR5: Being a member=F, Missed deadline=T, 15th rental=F -> (no discount, no gift)\nR6: Being a member=F, Missed deadline=F, 15th rental=F -> (no discount, no gift)\nR7: Being a member=F, Missed deadline=F, 15th rental=T -> (no discount, no gift)\nR8: Being a member=F, Missed deadline=T, 15th rental=T -> Gift T-Shirt\n\nBased ONLY on the feature description of the Customer Relationship Management system, which of the above rules describes an impossible situation?", "options": ["R4", "R2", "R6", "R8"], "correct": [3], "context": null, "perOption": ["Is not correct. A member without a missed deadline can get a discount and a gift T-Shirt after 15 bicycle rentals", "Is not correct. A member without a missed deadline can get a discount but no gift T-Shirt until they rented a bicycle 15 times", "Is not correct. Non-members cannot get a discount, even if they did not miss a deadline yet", "Is correct. No discount as a non-member that has also missed a deadline, but only members can receive a gift T-Shirt. Hence, the action is not correct"], "chapter": "Chapter 4: Test Analysis and Design", "chapterNum": 4}, {"id": "Q23", "text": "You test a system whose lifecycle is modeled by the state transition diagram shown below. The system starts in the INIT state and ends its operation in the OFF state. ![](media/image3.png){width=\"3.3359711286089238in\" height=\"1.24in\"} What is the MINIMAL number of test cases to achieve valid transitions coverage?", "options": ["4", "2", "7", "3"], "correct": [3], "context": "“test” and “error” transitions cannot occur in one test case. Neither can both “done” transitions. This means we need at least three test cases to achieve transition coverage. For example: TC1: test, done TC2: run, error, done TC3: run, pause, resume, pause, done", "perOption": ["Is not correct.", "Is not correct.", "Is not correct.", "Is correct."], "chapter": "Chapter 4: Test Analysis and Design", "chapterNum": 4}, {"id": "Q24", "text": "Your test suite achieved 100% statement coverage. What is the consequence of this fact?", "options": ["Each instruction in the code that contains a defect has been executed at least once", "Any test suite containing more test cases than your test suite will also achieve 100% statement coverage", "Each path in the code has been executed at least once", "Every combination of input values has been tested at least once"], "correct": [0], "context": null, "perOption": ["Is correct. Since 100% statement coverage is achieved, every statement, including the ones with defects, must have been executed and evaluated at least once", "Is not correct. Coverage depends on what is tested, not on the number of test cases. For example, for code “if (x==0) y=1”, one test case (x=0) achieves 100% statement coverage, but two test cases (x=1) and (x=2) together achieve only 50% statement coverage", "Is not correct. If there is a loop in the code there may be an infinite number of possible paths, so it is not possible to execute all the possible paths in the code", "Is not correct. Exhaustive testing is not possible (see the seven testing principles section in the syllabus). For example, for code “input x; print x” any single test with arbitrary x achieves 100% statement coverage, but covers one input value"], "chapter": "Chapter 4: Test Analysis and Design", "chapterNum": 4}, {"id": "Q25", "text": "Which of the following is NOT true for white-box testing?", "options": ["During white-box testing the entire software implementation is considered", "White-box coverage metrics can help identify additional tests to increase code coverage", "White-box test techniques can be used in static testing", "White-box testing can help identify gaps in requirements implementation"], "correct": [3], "context": null, "perOption": ["Is not correct. The fundamental strength of white-box test techniques is that the entire software implementation is taken into account during testing", "Is not correct. White-box coverage measures provide an objective measure of coverage and provide the necessary information to allow additional tests to be generated to increase this coverage", "Is not correct. White-box test techniques can be used to perform reviews (static testing)", "Is correct. This is the weakness of the white-box test techniques. They are not able to identify the missing implementation, because they are based solely on the test object structure, not on the requirements specification"], "chapter": "Chapter 4: Test Analysis and Design", "chapterNum": 4}, {"id": "Q26", "text": "Which of the following BEST describes the concept behind error guessing?", "options": ["Error guessing involves using your knowledge and experience of defects found in the past and typical errors made by developers", "Error guessing involves using your personal experience of development and the errors you made as a developer", "Error guessing requires you to imagine that you are the user of the test object and to guess errors the user could make interacting with it", "Error guessing requires you to rapidly duplicate the development task to identify the sort of errors a developer might make"], "correct": [0], "context": null, "perOption": ["Is correct. The basic concept behind error guessing is that the tester tries to guess what errors may have been made by the developer and what defects may be in the test object based on past experience (and sometimes checklists)", "Is not correct. Although a tester who used to be a developer may use their personal experience to help them when performing error guessing, the test technique is not based on prior knowledge of development", "Is not correct. Error guessing is not a usability technique for guessing how users may fail to interact with the test object", "Is not correct. Duplicating the development task has several flaws that make it impractical, such as the tester having equivalent skills to the developer and the time involved to perform the development. It is not error guessing"], "chapter": "Chapter 4: Test Analysis and Design", "chapterNum": 4}, {"id": "Q27", "text": "In your project there has been a delay in the release of a brand-new application and test execution started late, but you have very detailed domain knowledge and good analytical skills. The full list of requirements has not yet been shared with the team, but management is asking for some test results to be presented. Which test technique fits BEST in this situation?", "options": ["Checklist-based testing", "Error guessing", "Exploratory testing", "Branch testing"], "correct": [2], "context": null, "perOption": ["Is not correct. This is a new product. You probably do not have a checklist yet and test conditions might not be known due to missing requirements", "Is not correct. This is a new product. You probably do not have enough information to make correct error guesses", "Is correct. Exploratory testing is most useful when there are few known specifications and/or there is a pressing timeline for testing", "Is not correct. Branch testing is time-consuming, and your management is asking about some test results now. Also, branch testing does not involve domain knowledge"], "chapter": "Chapter 4: Test Analysis and Design", "chapterNum": 4}, {"id": "Q28", "text": "Which of the following BEST describes the way acceptance criteria can be documented?", "options": ["Performing retrospectives to determine the actual needs of the stakeholders regarding a given user story", "Using the given/when/then format to describe an example test condition related to a given user story", "Using verbal communication to reduce the risk of misunderstanding the acceptance criteria by others", "Documenting risks related to a given user story in a test plan to facilitate the risk-based testing of a given user story"], "correct": [1], "context": null, "perOption": ["Is not correct. Retrospectives are used to capture lessons learned and to improve the development and testing process, not to document the acceptance criteria", "Is correct. This is the standard way to document acceptance criteria", "Is not correct. Verbal communication does not allow to physically document the acceptance criteria as part of a user story (”card” aspect in the 3C’s model)", "Is not correct. Acceptance criteria are related to a user story, not a test plan. Also, acceptance criteria are the conditions that have to be fulfilled to decide if the user story is complete. Risks are not such conditions"], "chapter": "Chapter 4: Test Analysis and Design", "chapterNum": 4}, {"id": "Q29", "text": "Consider the following user story: *As an Editor* *I want to review content before it is published so that I can ensure the grammar is correct* and its acceptance criteria: - The user can log in to the content management system with \"Editor\" role - The editor can view existing content pages - The editor can edit the page content - The editor can add markup comments - The editor can save changes - The editor can reassign to the \"content owner\" role to make updates Which of the following is the BEST example of an ATDD test for this user story?", "options": ["Test if the editor can save the document after edit the page content", "Test if the content owner can log in and make updates to the content", "Test if the editor can schedule the edited content for publication", "Test if the editor can reassign to another editor to make updates"], "correct": [0], "context": null, "perOption": ["Is correct. This test covers two acceptance criteria: one about editing the document and one about saving changes", "Is not correct. Acceptance criteria cover the editor activities, not the content owner activities", "Is not correct. Scheduling the edited content for publication may be a nice feature, but it is not covered by the acceptance criteria", "Is not correct. Acceptance criteria state about reassigning from an editor to the content owner, not to another editor"], "chapter": "Chapter 4: Test Analysis and Design", "chapterNum": 4}, {"id": "A4", "text": "Consider the following testware.\n\nTest Charter #04.018, Session time: 1h\nExplore: Registration page\nWith: Different sets of incorrect input data\nTo discover: Defects related to accepting the registration process with the incorrect input\n\nWhich test activity produces this testware as an output?", "options": ["Test planning", "Test monitoring and test control", "Test analysis", "Test design"], "correct": [3], "context": "The testware under consideration is a test charter Test charters are the output from test design", "perOption": ["Is not correct.", "Is not correct.", "Is not correct.", "Is correct."], "chapter": "Chapter 4: Test Analysis and Design", "chapterNum": 4}, {"id": "A15", "text": "A wine storage system uses a control device that measures the wine cell temperature T (measured in °C, rounded to the nearest degree) and alarms the user if it deviates from the optimal value of 12, according to the following rules: - if T = 12, the system says, \"optimal temperature\" - if T < 12, the system says, \"temperature is too low!\" - if T > 12, the system says, \"temperature is too high!\" You want to use the 3-point boundary value analysis (BVA) to verify the behavior of the control device. A test input is a temperature in °C provided by the device. What is the MINIMAL set of test inputs that achieves 100% of the desired coverage?", "options": ["11, 12, 13", "10, 12, 14", "10, 11, 12, 13, 14", "10, 11, 13, 14"], "correct": [2], "context": "There are three equivalence partitions: {..., 10, 11}, {12}, and {13, 14, ...}. The boundary values are 11, 12 and 13. In the three-point boundary value analysis for each boundary, we need to test the boundary and both its neighbors, so: for 11 we test 10, 11, 12 for 12 we test 11, 12, 13 for 13 we test 12, 13, 14 Altogether we need to test 10, 11, 12, 13, and 14", "perOption": ["Is not correct.", "Is not correct.", "Is correct.", "Is not correct."], "chapter": "Chapter 4: Test Analysis and Design", "chapterNum": 4}, {"id": "A16", "text": "Which of the following statements about branch testing is CORRECT?", "options": ["If a program includes only unconditional branches, then 100% branch coverage can be achieved without executing any test cases", "If the test cases exercise all unconditional branches in the code, then 100% branch coverage is achieved", "If 100% statement coverage is achieved, then 100% branch coverage is also achieved", "If 100% branch coverage is achieved, then all decision outcomes in each decision statement in the code are exercised"], "correct": [3], "context": null, "perOption": ["Is not correct. In this case one test case is still needed since there is at least one (unconditional) branch to be covered", "Is not correct. Covering only unconditional branches does not imply covering all conditional branches", "Is not correct. 100% branch coverage implies 100% statement coverage, not otherwise. For example, for an IF decision without the ELSE, one test is enough to achieve 100% statement coverage, but it only achieves 50% branch coverage", "Is correct. Each decision outcome corresponds to a conditional branch, so 100% branch coverage implies 100% coverage of the decision outcomes"], "chapter": "Chapter 4: Test Analysis and Design", "chapterNum": 4}, {"id": "A17", "text": "You are testing a mobile application that allows customers to access and manage their bank accounts. You are running a test suite that involves evaluating each screen, and each field on each screen, against a general list of user interface best practices derived from a popular book on the topic that maximizes usability for such applications. Which of the following options BEST categorizes the test technique you are using?", "options": ["Black-box", "Exploratory", "Checklist-based", "Error guessing"], "correct": [2], "context": null, "perOption": ["Is not correct. The book provides general guidance, and is not a formal requirements document, a specification, or a set of use cases, user stories, or business processes", "Is not correct. While you could consider the list as a set of test charters, it more closely resembles the list of test conditions to be checked", "Is correct. The list of user interface best practices is the list of test conditions to be systematically checked", "Is not correct. The tests are not focused on failures that could occur, but rather on knowledge about what is important for the user, in terms of usability"], "chapter": "Chapter 4: Test Analysis and Design", "chapterNum": 4}, {"id": "A18", "text": "Which of the following BEST describe the collaborative approach to user story writing?", "options": ["User stories are created by testers and developers and then accepted by business representatives", "User stories are created by business representatives, developers, and testers together", "User stories are created by business representatives and verified by developers and testers", "User stories are created in a way that they are independent, negotiable, valuable, estimable, small, and testable"], "correct": [1], "context": null, "perOption": ["Is not correct. Collaborative user story writing means that all stakeholders create the user stories collaboratively, to obtain the shared vision", "Is correct. Collaborative user story writing means that all stakeholders create the user stories collaboratively, to obtain the shared vision", "Is not correct. Collaborative user story writing means that all stakeholders create the user stories collaboratively, to obtain the shared vision", "Is not correct. This is the list of properties that each user story should have, not the description of the collaboration-based approach"], "chapter": "Chapter 4: Test Analysis and Design", "chapterNum": 4}, {"id": "Q30", "text": "How do testers add value to iteration and release planning?", "options": ["Testers determine the priority of the user stories to be developed", "Testers focus only on the functional aspects of the system to be tested", "Testers participate in the detailed risk identification and risk assessment of user stories", "Testers guarantee the release of high-quality software through early test design during the release planning"], "correct": [2], "context": null, "perOption": ["Is not correct. Priorities for user stories are determined by the business representative together with the development team", "Is not correct. Testers focus on both functional and non-functional aspects of the system to be tested", "Is correct. According to the syllabus, this is one of the ways testers add value to iteration and release planning", "Is not correct. Early test design is not part of release planning. Early test design does not automatically guarantee the release of quality software"], "chapter": "Chapter 5: Managing the Test Activities", "chapterNum": 5}, {"id": "Q31", "text": "Which TWO of the following options are the exit criteria for testing a system?", "options": ["Test environment readiness", "The ability to log in to the test object by the tester", "Estimated defect density is reached", "Requirements are translated into given/when/then format", "Regression tests are automated"], "correct": [2, 4], "context": null, "perOption": ["Is not correct. Test environment readiness is a resource availability criterion; hence it belongs to the entry criteria", "Is not correct. This is a resource availability criterion; hence it belongs to the entry criteria", "Is correct. Estimated defect density is a measure of diligence; hence it belongs to the exit criteria.", "Is not correct. Requirements translated into a given format result in testable requirements; hence it belongs to the entry criteria", "Is correct. Automation of regression tests is a completion criterion; hence it belongs to the exit criteria"], "chapter": "Chapter 5: Managing the Test Activities", "chapterNum": 5}, {"id": "Q32", "text": "Your team uses the three-point estimation technique to estimate the test effort for a new high-risk feature. The following estimates were made: - Most optimistic estimation: 2 person-hours - Most likely estimation: 11 person-hours - Most pessimistic estimation: 14 person-hours What is the final estimate?", "options": ["9 person-hours", "14 person-hours", "11 person-hours", "10 person-hours"], "correct": [3], "context": "In the three-point estimation technique: E = (optimistic + 4*most likely + pessimistic)/6 E = (2+(4*11)+14)/6 = 10", "perOption": ["Is not correct.", "Is not correct.", "Is not correct.", "Is correct."], "chapter": "Chapter 5: Managing the Test Activities", "chapterNum": 5}, {"id": "Q33", "text": "You are testing a mobile application that allows users to find a nearby restaurant based on the type of food they want to eat. Consider the following list of test cases, priorities (i.e., a smaller number means a higher priority), and dependencies:\n\nTC 001: Select type of food, Priority 3, Logical dependency: none\nTC 002: Select restaurant, Priority 2, Logical dependency: TC 001\nTC 003: Get direction, Priority 1, Logical dependency: TC 002\nTC 004: Call restaurant, Priority 2, Logical dependency: TC 002\nTC 005: Make reservation, Priority 3, Logical dependency: TC 002\n\nWhich of the following test cases should be executed as the third one?", "options": ["TC 003", "TC 005", "TC 002", "TC 001"], "correct": [0], "context": "Test TC 001 must come first, followed by TC 002, to satisfy dependencies. Afterwards, TC 003 to satisfy priority and then TC 004, followed by TC 005.", "perOption": ["Is correct.", "Is not correct.", "Is not correct.", "Is not correct."], "chapter": "Chapter 5: Managing the Test Activities", "chapterNum": 5}, {"id": "Q34", "text": "Consider the following test categories (1-4) and agile testing quadrants (A-D): 1. Usability testing 2. Component testing 3. Functional testing 4. Reliability testing A. Agile testing quadrant Q1: technology facing, supporting the development team B. Agile testing quadrant Q2: business facing, supporting the development team C. Agile testing quadrant Q3: business facing, critique the product D. Agile testing quadrant Q4: technology facing, critique the product How do the following test categories map onto the agile testing quadrants?", "options": ["1C, 2A, 3B, 4D", "1D, 2A, 3C, 4B", "1C, 2B, 3D, 4A", "1D, 2B, 3C, 4A"], "correct": [0], "context": "Considering: Usability testing is in Q3 (1 – C) Component testing is in Q1 (2 – A) Functional testing is in Q2 (3 – B) Reliability testing is in Q4 (4 – D)", "perOption": ["Is correct.", "Is not correct.", "Is not correct.", "Is not correct."], "chapter": "Chapter 5: Managing the Test Activities", "chapterNum": 5}, {"id": "Q35", "text": "During a risk analysis the following risk was identified and assessed: - Risk: Response time is too long to generate a report - Risk likelihood: medium; risk impact: high - Response to risk: - An independent test team performs performance efficiency testing during system testing - A selected sample of end users performs alpha testing and beta testing before the release What measure is proposed to be taken in response to this analyzed risk?", "options": ["Risk acceptance", "Contingency plan", "Risk mitigation", "Risk transfer"], "correct": [2], "context": null, "perOption": ["Is not correct. We do not accept the risk; concrete actions are proposed", "Is not correct. No contingency plans are proposed", "Is correct. The proposed actions are related to testing, which is a form of risk mitigation", "Is not correct. Risk is not transferred but mitigated"], "chapter": "Chapter 5: Managing the Test Activities", "chapterNum": 5}, {"id": "Q36", "text": "Which work product can be used by an agile team to show the amount of work that has been completed and the amount of total work remaining for a given iteration?", "options": ["Acceptance criteria", "Defect report", "Test completion report", "Burndown chart"], "correct": [3], "context": null, "perOption": ["Is not correct. Acceptance criteria are the conditions used to decide whether the user story is ready. They cannot show work progress", "Is not correct. Defect reports inform about the defects. They do not show work progress", "Is not correct. Test completion report can be created after the iteration is finished, so it will not show the progress continuously within an iteration", "Is correct. Burndown charts are a graphical representation of work left to do versus time remaining. They are updated daily, so they can continuously show the work progress"], "chapter": "Chapter 5: Managing the Test Activities", "chapterNum": 5}, {"id": "Q37", "text": "You need to update one of the automated test scripts to be in line with a new requirement. Which process indicates that you create a new version of the test script in the test repository?", "options": ["Traceability management", "Maintenance testing", "Configuration management", "Requirements engineering"], "correct": [2], "context": null, "perOption": ["Is not correct. Traceability is the relationship between two or more work products, not between different versions of the same work product", "Is not correct. Maintenance testing is about testing changes; it is not related closely to versioning", "Is correct. To support testing, configuration management may involve the version control of all test items", "Is not correct. Requirements engineering is the elicitation, documentation, and management of requirements; it is not closely related to test script versioning"], "chapter": "Chapter 5: Managing the Test Activities", "chapterNum": 5}, {"id": "Q38", "text": "You received the following defect report from the developers stating that the anomaly described in this test report is not reproducible.\n\n“Application hangs up”\n2022-May-03 -- John Doe -- Rejected\n“The application hangs up after entering “Test input: $ä” in the Name field on the new user creation screen. Tried to log off, log in with test_admin01 account, same issue. Tried with other test admin accounts, same issue. No error message received; log (see attached) contains fatal error notification. Based on the test case TC-1305, the application should accept the provided input and create the user. Please fix with high priority, this feature is related to REQ-0012, which is a critical new business requirement.”\n\nWhat critical information is MISSING from this test report that would have been useful for the developers?", "options": ["Expected result and actual result", "References and defect status", "Test environment and test item", "Priority and severity"], "correct": [2], "context": null, "perOption": ["Is not correct. The expected result is “the application should accept the provided input and create the user”. The actual result is “The application hangs up after entering “Test input. $ä””.", "Is not correct. There is a reference to the test case and to the related requirement and it states that the defect is rejected. Also, the defect status would not be very helpful for the developers", "Is correct. We do not know in which test environment the anomaly was detected, and we also do not know which application (and its version) is affected", "Is not correct. The defect report states that the anomaly is urgent, that it is a global issue (i.e., many, if not all, test administration accounts are affected) and states the impact is high for business stakeholders"], "chapter": "Chapter 5: Managing the Test Activities", "chapterNum": 5}, {"id": "A19", "text": "Consider the following part of a test plan. *Testing will be performed using component testing and component integration testing. The regulations require to demonstrate that 100% branch coverage is achieved for each component classified as critical.* Which part of the test plan does this part belong to?", "options": ["Communication", "Risk register", "Context of testing", "Test approach"], "correct": [3], "context": null, "perOption": ["Is not correct. The paragraph contains information on test levels and exit criteria, which are part of the test approach", "Is not correct. The paragraph contains information on test levels and exit criteria, which are part of the test approach", "Is not correct. The paragraph contains information on test levels and exit criteria, which are part of the test approach", "Is correct. The paragraph contains information on test levels and exit criteria, which are part of the test approach"], "chapter": "Chapter 5: Managing the Test Activities", "chapterNum": 5}, {"id": "A20", "text": "Your team uses planning poker to estimate the test effort for a newly required feature. There is a rule in your team that if there is no time to reach full agreement and the variation in the results is small, rules like \"accept the number with the most votes\" can be applied. After two rounds, the consensus was not reached, so the third round was initiated. You can see the test estimation results in the table below.\n\nRound 1: 21, 2, 5, 34, 13, 8, 2\nRound 2: 13, 8, 8, 34, 13, 8, 5\nRound 3: 13, 8, 13, 13, 13, 13, 8\n\nWhich of the following is the BEST example of the next step?", "options": ["The product owner has to step in and make a final decision", "Accept 13 as the final test estimate as this has most of the votes", "No further action is needed. Consensus has been reached", "Remove the new feature from the current release because consensus has not been reached"], "correct": [1], "context": null, "perOption": ["Is not correct. This should be a team activity and not overruled by one team member", "Is correct. If test estimates are not the same, but the variation in the results is small, applying rules like “accept the number with the most votes” can be applied", "Is not correct. There is no consensus yet as some say 13, others say 8", "Is not correct. A feature should not be removed only because the team cannot agree on the test estimates"], "chapter": "Chapter 5: Managing the Test Activities", "chapterNum": 5}, {"id": "A21", "text": "Which of the following is TRUE regarding the test pyramid?", "options": ["It emphasizes having far more tests at the lower test levels", "It suggests that each low-level test checks a large part of the functionality", "It describes distribution of test types across the SDLC", "It has no impact on the construction of automated tests"], "correct": [0], "context": null, "perOption": ["Is correct. The test pyramid emphasizes h
